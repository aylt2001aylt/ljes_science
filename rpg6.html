            if (!raw) return DEFAULT_USER_DATA;
            const data = JSON.parse(raw);

              console.log("Data expired, clearing storage.");
              localStorage.removeItem(STORAGE_KEY);
              return DEFAULT_USER_DATA;

                             </div>
                             <div>
                                 <h2 className="text-2xl font-black text-white italic">精神時光屋</h2>
                                 <p className="text-neutral-400 text-xs">單人修練・積分獲取</p>
                             </div>
                         </div>
                         <button onClick={onClose} className="p-2 hover:bg-white/10 rounded-full transition"><XCircle className="text-neutral-400 w-8 h-8"/></button>
                    </div>

                    <div className="relative z-10 w-full max-w-2xl bg-neutral-900/90 border border-neutral-700 rounded-2xl p-4 mb-8 flex justify-around items-center shadow-2xl">
                        <div className="text-center">
                             <div className="text-xs text-neutral-500 font-bold uppercase tracking-wider">剩餘時間</div>
                             <div className={`text-3xl font-black font-mono ${timeLeft < 10 ? 'text-red-500 animate-pulse' : 'text-white'}`}>{timeLeft}s</div>
                        </div>
                        <div className="w-px h-10 bg-neutral-700"></div>
                        <div className="text-center relative">
                             <div className="text-xs text-neutral-500 font-bold uppercase tracking-wider">本次得分</div>
                             <div className="text-3xl font-black text-yellow-400 font-mono">{score}</div>
                             {feedback && feedback.wrong === undefined && <div className="absolute -top-4 right-0 text-yellow-300 font-bold text-sm animate-pop">+PTS</div>}
                        </div>
                        <div className="w-px h-10 bg-neutral-700"></div>
                        <div className="text-center">
                             <div className="text-xs text-neutral-500 font-bold uppercase tracking-wider">連擊</div>
                             <div className={`text-3xl font-black font-mono italic ${combo > 1 ? 'text-purple-400 scale-110' : 'text-neutral-600'}`}>x{combo}</div>
                        </div>
                    </div>

                    <div className="relative z-10 w-full flex-1 flex flex-col justify-center">
                        {gameStatus === 'playing' ? (
                            <QuestionCard 
                                question={question} 
                                onAnswer={handleAnswer} 
                                feedback={feedback} 
                                disabled={!!feedback}
                            />
                        ) : (
                            <div className="bg-neutral-900/95 border border-yellow-500 rounded-3xl p-8 text-center max-w-md mx-auto shadow-[0_0_50px_rgba(234,179,8,0.2)] animate-pop">
                                <Trophy className="w-20 h-20 text-yellow-500 mx-auto mb-4" />
                                <h3 className="text-3xl font-black text-white mb-2">修練完成</h3>
                                <div className="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-600 font-mono mb-4">{score}</div>
                                
                                <div className="bg-neutral-800 rounded-xl p-4 mb-6 border border-neutral-700">
                                    <div className="flex justify-between items-center mb-2 text-sm text-neutral-400">
                                        <span>換算積分</span>
                                        <span className="text-white font-bold text-lg">+{Math.min(100, Math.floor(score/5))}</span>
                                    </div>
                                    {Math.floor(score/5) > 100 && (
                                        <div className="text-xs text-red-400 bg-red-900/20 px-2 py-1 rounded">
                                            已達單次獲取上限 (100)
                                        </div>
                                    )}
                                </div>

                                <button onClick={handleFinish} className="w-full bg-yellow-600 hover:bg-yellow-500 text-black font-black py-4 rounded-xl text-xl shadow-lg transition transform hover:scale-105">
                                    領取獎勵並離開
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // GachaModal (無變動)
        const GachaModal = ({ onClose, onComplete, userPoints }) => {
          const [mode, setMode] = useState(null); 
          const [spinning, setSpinning] = useState(false);
          const [results, setResults] = useState(null); 

          const spin = (count) => {
            const cost = count * 10;
            if (userPoints < cost) return;
            setSpinning(true);
            let pool = mode === 'title' ? TITLES_POOL : mode === 'weapon' ? WEAPONS_POOL : ARMORS_POOL;
            const newResults = [];
            for(let i=0; i<count; i++) {
                const rand = Math.random() * 100;
                let sum = 0;
                let selected = pool[pool.length - 1];
                for (let t of pool) {
                  sum += t.prob;
                  if (rand <= sum) {
                    selected = t;
                    break;
                  }
                }
                newResults.push(selected);
            }
            setTimeout(() => {
              setResults(newResults);
              setSpinning(false);
              onComplete(mode, newResults);
            }, 2000);
          };

          return (
            <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-yellow-600 rounded-3xl p-6 w-full max-w-sm text-center relative max-h-[90vh] overflow-y-auto animate-pop">
                <button onClick={onClose} className="absolute top-4 right-4 text-neutral-500"><XCircle /></button>
                <h2 className="text-2xl font-black text-yellow-500 mb-2 flex items-center justify-center gap-2"><Dices /> 命運轉盤</h2>
                <p className="text-neutral-400 text-sm mb-6">每次抽獎消耗 10 積分</p>
                {!mode ? (
                  <div className="grid grid-cols-1 gap-3">
                    <button onClick={() => setMode('title')} className="glass-btn p-4 rounded-xl flex items-center justify-between text-white font-bold">
                      <span className="flex items-center gap-2"><Crown className="text-yellow-500"/> 稱號</span>
                      <span className="text-xs bg-neutral-900 px-2 py-1 rounded">裝飾</span>
                    </button>
                    <button onClick={() => setMode('weapon')} className="glass-btn p-4 rounded-xl flex items-center justify-between text-white font-bold">
                      <span className="flex items-center gap-2"><Axe className="text-red-500"/> 武器</span>
                      <span className="text-xs bg-neutral-900 px-2 py-1 rounded">增加攻擊</span>
                    </button>
                    <button onClick={() => setMode('armor')} className="glass-btn p-4 rounded-xl flex items-center justify-between text-white font-bold">
                      <span className="flex items-center gap-2"><Shield className="text-blue-500"/> 防具</span>
                      <span className="text-xs bg-neutral-900 px-2 py-1 rounded">增加血量</span>
                    </button>
                  </div>
                ) : !results ? (
                  <div className="flex flex-col items-center">
                    <div className={`w-32 h-32 rounded-full border-4 border-yellow-500 mb-6 flex items-center justify-center bg-neutral-800 ${spinning ? 'animate-spin' : ''}`}>
                       {mode === 'title' ? <Crown className="w-12 h-12 text-yellow-500"/> : mode === 'weapon' ? <Axe className="w-12 h-12 text-red-500"/> : <Shield className="w-12 h-12 text-blue-500"/>}
                    </div>
                    <div className="w-full space-y-3">
                        <button onClick={() => spin(1)} disabled={userPoints < 10 || spinning} className="w-full bg-yellow-600 hover:bg-yellow-500 disabled:opacity-50 text-black font-black py-3 rounded-xl flex justify-between px-4">
                          <span>單抽</span>
                          <span>10 積分</span>
                        </button>
                        <button onClick={() => spin(5)} disabled={userPoints < 50 || spinning} className="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 disabled:opacity-50 text-white font-black py-3 rounded-xl flex justify-between px-4">
                          <span>5 連抽</span>
                          <span>50 積分</span>
                        </button>
                    </div>
                    {spinning && <p className="mt-4 text-yellow-500 animate-pulse">祈禱中...</p>}
                    <button onClick={() => setMode(null)} disabled={spinning} className="mt-4 text-neutral-500 text-sm">返回</button>
                  </div>
                ) : (
                  <div className="animate-slide-up flex flex-col items-center">
                    <p className="text-neutral-400 text-sm mb-4">恭喜獲得</p>
                    <div className={`grid ${results.length > 1 ? 'grid-cols-2 gap-2' : 'grid-cols-1'} w-full max-h-[60vh] overflow-y-auto`}>
                        {results.map((res, idx) => (
                            <div key={idx} className="bg-neutral-800 p-3 rounded-xl border border-neutral-700 flex flex-col items-center justify-center animate-pop" style={{animationDelay: `${idx*0.1}s`}}>
                                {res.icon && <div className={`mb-2 ${res.color}`}><res.icon size={48} /></div>}
                                <h3 className={`text-lg font-black ${res.color}`}>{res.name}</h3>
                                {res.atk && <p className="text-red-400 text-xs font-bold">ATK +{res.atk}</p>}
                                {res.hp && <p className="text-blue-400 text-xs font-bold">HP +{res.hp}</p>}
                            </div>
                        ))}
                    </div>
                    <button onClick={() => { setResults(null); setMode(null); }} className="bg-neutral-700 hover:bg-neutral-600 px-8 py-2 rounded-full text-white mt-6 w-full">收下</button>
                  </div>
                )}
              </div>
            </div>
          );
        };

        const InventoryModal = ({ userData, onEquip, onClose }) => {
          const [tab, setTab] = useState('weapon'); 

          const getList = () => {
            if (tab === 'title') return { pool: TITLES_POOL, userInv: userData.inventory.titles, current: userData.equipped.title };
            if (tab === 'weapon') return { pool: WEAPONS_POOL, userInv: userData.inventory.weapons, current: userData.equipped.weapon };
            return { pool: ARMORS_POOL, userInv: userData.inventory.armors, current: userData.equipped.armor };
          };

          const { pool, userInv, current } = getList();
          const ownedItems = pool.filter(item => userInv[item.id]).sort((a,b) => (b.prob - a.prob)); 

          return (
            <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-neutral-700 rounded-3xl w-full max-w-md h-[80vh] flex flex-col animate-slide-up">
                <div className="p-4 border-b border-neutral-800 flex justify-between items-center">
                  <h2 className="text-xl font-bold text-white flex items-center gap-2"><Backpack /> 冒險背包</h2>
                  <button onClick={onClose}><XCircle className="text-neutral-500" /></button>
                </div>
                <div className="flex p-2 gap-2 bg-neutral-950">
                  <button onClick={() => setTab('weapon')} className={`flex-1 py-2 rounded-lg text-sm font-bold ${tab === 'weapon' ? 'bg-red-900/50 text-red-200 border border-red-800' : 'text-neutral-500'}`}>武器</button>
                  <button onClick={() => setTab('armor')} className={`flex-1 py-2 rounded-lg text-sm font-bold ${tab === 'armor' ? 'bg-blue-900/50 text-blue-200 border border-blue-800' : 'text-neutral-500'}`}>防具</button>
                  <button onClick={() => setTab('title')} className={`flex-1 py-2 rounded-lg text-sm font-bold ${tab === 'title' ? 'bg-yellow-900/50 text-yellow-200 border border-yellow-800' : 'text-neutral-500'}`}>稱號</button>
                </div>
                <div className="flex-1 overflow-y-auto p-2 space-y-2">
                  {ownedItems.length === 0 && <div className="text-center text-neutral-600 mt-10">空空如也</div>}
                  {ownedItems.map(item => (
                    <div key={item.id} onClick={() => onEquip(tab, item.id)} className={`p-3 rounded-xl border flex justify-between items-center cursor-pointer transition ${current === item.id ? 'bg-green-900/20 border-green-500' : 'bg-neutral-800 border-neutral-700 hover:border-neutral-500'}`}>
                      <div className="flex items-center gap-4">
                        {item.icon && <div className={`${item.color} bg-black/40 p-2 rounded-lg`}><item.icon size={24}/></div>}
                        <div>
                          <div className={`font-bold ${item.color}`}>{item.name} <span className="text-xs text-neutral-500 ml-1">x{userInv[item.id]}</span></div>
                          <div className="text-xs text-neutral-400">
                            {item.atk && `ATK +${item.atk}`}
                            {item.hp && `HP +${item.hp}`}
                            {!item.atk && !item.hp && '裝飾用'}
                          </div>
                        </div>
                      </div>
                      {current === item.id && <div className="text-xs bg-green-600 text-white px-2 py-1 rounded">已裝備</div>}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        };

        const MenuView = ({ userData, onStart, onGacha, onInv, onTraining, onReset }) => {
          const myTitle = TITLES_POOL.find(t => t.id === userData.equipped.title);
          const myWeapon = WEAPONS_POOL.find(w => w.id === userData.equipped.weapon);
          const myArmor = ARMORS_POOL.find(a => a.id === userData.equipped.armor);

          const getRarityStyle = (item) => {
                if (!item) return "text-neutral-600";
                let base = item.color;
                if (item.prob <= 1) return `${base} glow-legendary animate-pulse font-black`;
                if (item.prob <= 2) return `${base} glow-epic font-bold`;
                if (item.prob <= 3) return `${base} glow-rare font-bold`;
                return base;
          };

          return (
            <div className="fixed inset-0 bg-neutral-950 text-white flex flex-col items-center justify-center p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-neutral-800 to-neutral-950">
               <div className="w-full max-w-md space-y-6 animate-slide-up">
                 <header className="text-center">
                    <h1 className="text-5xl font-black italic text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 flex justify-center items-center gap-3">
                      <Swords className="w-12 h-12 text-purple-500" /> 洛津國小大亂鬥
                    </h1>
                 </header>

                 <div className="glass-panel rounded-3xl p-6 shadow-2xl relative">
                    <div className="flex flex-col items-center">
                       {/* 角色與稱號 */}
                       <div className="w-24 h-24 bg-neutral-800 rounded-full mb-3 flex items-center justify-center border-4 border-neutral-700 shadow-inner relative">
                          <Users className="w-12 h-12 text-neutral-400" />
                          {myTitle && <div className="absolute -top-2 -right-2 bg-neutral-900 rounded-full p-1.5 border border-yellow-500 shadow-lg"><myTitle.icon className={`w-5 h-5 ${myTitle.color}`} /></div>}
                       </div>
                       
                       <div className={`text-2xl font-bold mb-4 ${getRarityStyle(myTitle)}`}>
                          {myTitle ? myTitle.name : "無名小卒"}
                       </div>

                       {/* 裝備展示 (大圖示) */}
                       <div className="flex gap-4 mb-6 w-full justify-center">
                           <div className="flex-1 bg-neutral-900/60 p-3 rounded-2xl border border-white/5 flex flex-col items-center gap-2">
                               <span className="text-[10px] text-neutral-500 uppercase tracking-wider font-bold">WEAPON</span>
                               <div className={`h-12 flex items-center justify-center transition-all duration-300 ${myWeapon ? myWeapon.color : 'text-neutral-700'}`}>
                                   {myWeapon ? <myWeapon.icon size={40} className={getRarityStyle(myWeapon)} /> : <X size={32}/>}
                               </div>
                               <span className={`text-xs truncate max-w-full font-bold ${myWeapon ? myWeapon.color : 'text-neutral-600'}`}>{myWeapon ? myWeapon.name : "空手"}</span>
                           </div>
                           
                           <div className="flex-1 bg-neutral-900/60 p-3 rounded-2xl border border-white/5 flex flex-col items-center gap-2">
                               <span className="text-[10px] text-neutral-500 uppercase tracking-wider font-bold">ARMOR</span>
                               <div className={`h-12 flex items-center justify-center transition-all duration-300 ${myArmor ? myArmor.color : 'text-neutral-700'}`}>
                                   {myArmor ? <myArmor.icon size={40} className={getRarityStyle(myArmor)} /> : <Ghost size={32}/>}
                               </div>
                               <span className={`text-xs truncate max-w-full font-bold ${myArmor ? myArmor.color : 'text-neutral-600'}`}>{myArmor ? myArmor.name : "裸奔"}</span>
                           </div>
                       </div>

                       <div className="flex items-center gap-2 text-yellow-500 bg-yellow-900/20 px-4 py-1 rounded-full border border-yellow-500/20 mb-6">
                          <Zap className="w-4 h-4 fill-yellow-500" />
                          <span className="font-mono font-bold text-lg">{userData.points}</span>
                       </div>
                       
                       <div className="grid grid-cols-2 gap-3 w-full">
                          <button onClick={onInv} className="glass-btn py-3 rounded-xl flex items-center justify-center gap-2 font-bold"><Backpack className="w-4 h-4"/> 背包</button>
                          <button onClick={onGacha} className="glass-btn py-3 rounded-xl flex items-center justify-center gap-2 font-bold"><Dices className="w-4 h-4"/> 抽獎</button>
                       </div>
                    </div>
                 </div>

                 <button onClick={onTraining} className="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:opacity-90 text-white font-black py-4 rounded-2xl shadow-lg text-xl flex items-center justify-center gap-3 transition transform active:scale-95">
                     <BookOpen className="w-6 h-6" /> 進入精神時光屋 (刷分)
                 </button>

                 <div className="space-y-3 pt-4 border-t border-neutral-800">
                    <button onClick={() => onStart('create')} className="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-white font-black py-4 rounded-2xl shadow-lg text-xl flex items-center justify-center gap-3 transition transform active:scale-95">
                       <Flame className="w-6 h-6 animate-pulse" /> 建立大亂鬥戰場
                    </button>
                    <div className="flex gap-2">
                       <input type="number" id="code" placeholder="輸入戰場代碼" className="flex-1 bg-neutral-900 border border-neutral-700 rounded-xl px-4 text-center font-mono text-lg outline-none focus:border-purple-500 transition" />
                       <button onClick={() => onStart('join', document.getElementById('code').value)} className="bg-neutral-800 hover:bg-neutral-700 text-white font-bold px-8 rounded-xl border border-neutral-700">加入</button>
                    </div>
                 </div>

                 <button onClick={onReset} className="w-full mt-8 text-neutral-600 text-xs flex items-center justify-center gap-1 hover:text-red-500"><Eraser className="w-3 h-3"/> 重置所有資料</button>
               </div>
            </div>
          );
        };

        const LobbyView = ({ roomCode, players, isHost, onStart, onAddAI, onLeave }) => {
           const pList = Object.values(players);
           const getItem = (pool, id) => pool.find(i => i.id === id);

           const getRarityStyle = (item) => {
                if (!item) return "text-neutral-600";
                let base = item.color;
                if (item.prob <= 1) return `${base} glow-legendary animate-pulse font-black`;
                if (item.prob <= 2) return `${base} glow-epic font-bold`;
                if (item.prob <= 3) return `${base} glow-rare font-bold`;
                return base;
           };

           return (
             <div className="fixed inset-0 bg-neutral-950 text-white flex flex-col items-center justify-center p-6 bg-[url('https://images.unsplash.com/photo-1614728263952-84ea256f9679?q=80&w=2808&auto=format&fit=crop')] bg-cover bg-center">
                <div className="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
                <div className="glass-panel p-6 rounded-3xl w-full max-w-2xl relative animate-slide-up">
                   <button onClick={onLeave} className="absolute top-4 right-4 text-neutral-500 hover:text-white">離開</button>
                   <h2 className="text-3xl font-black text-center mb-2 text-purple-400 tracking-wider">等待大廳</h2>
                   <div className="text-center mb-6"><span className="bg-neutral-900/50 border border-neutral-700 px-6 py-2 rounded-lg font-mono text-2xl tracking-[0.2em] shadow-inner">{roomCode}</span></div>
                   <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-8">
                      {[0,1,2,3].map(i => {
                         const p = pList[i];
                         const title = p?.equipment?.title ? getItem(TITLES_POOL, p.equipment.title) : null;
                         const weapon = p?.equipment?.weapon ? getItem(WEAPONS_POOL, p.equipment.weapon) : null;
                         const armor = p?.equipment?.armor ? getItem(ARMORS_POOL, p.equipment.armor) : null;

                         return <div key={i} className="min-h-[200px] border-2 border-dashed border-neutral-700 rounded-xl flex flex-col items-center p-2 bg-neutral-800/50 relative overflow-hidden transition hover:border-neutral-500">
                            {p ? (
                               <>
                                 <div className={`w-12 h-12 rounded-full flex items-center justify-center mb-1 shadow-lg shrink-0 ${p.isAI ? 'bg-red-900 text-red-200' : 'bg-blue-900 text-blue-200'}`}>{p.isAI ? <Bot size={24}/> : <Users size={24}/>}</div>
                                 <div className="font-bold text-sm truncate w-full text-center mb-1">{p.name}</div>
                                 {title && <div className={`text-[10px] ${title.color} mb-2 flex items-center gap-1 justify-center bg-black/30 px-2 py-0.5 rounded-full`}><title.icon size={10} /> {title.name}</div>}
                                 
                                 {/* 裝備展示區 (含特效) */}
                                 <div className="flex gap-1 w-full justify-center mb-2">
                                     {/* 武器卡 */}
                                     <div className={`flex-1 bg-black/40 rounded p-1 flex flex-col items-center justify-center border border-white/5 ${weapon ? weapon.color : 'text-neutral-700'}`}>
                                         {weapon ? <weapon.icon size={20} className={getRarityStyle(weapon)} /> : <X size={16}/>}
                                     </div>
                                     {/* 防具卡 */}
                                     <div className={`flex-1 bg-black/40 rounded p-1 flex flex-col items-center justify-center border border-white/5 ${armor ? armor.color : 'text-neutral-700'}`}>
                                         {armor ? <armor.icon size={20} className={getRarityStyle(armor)} /> : <Ghost size={16}/>}
                                     </div>
                                 </div>

                                 <div className="text-[10px] text-neutral-400 font-mono bg-black/40 px-2 py-0.5 rounded-full">HP {p.maxHp} / ATK {p.atk}</div>
                               </>
                            ) : <span className="text-neutral-700 text-xs mt-10">等待加入...</span>}
                         </div>
                      })}
                   </div>
                   {isHost ? (
                      <div className="space-y-3">
                         <button onClick={onAddAI} disabled={pList.length>=4} className="w-full glass-btn py-3 rounded-xl font-bold hover:bg-white/10 disabled:opacity-50">加入 AI 機器人</button>
                         <button onClick={onStart} disabled={pList.length<2} className="w-full bg-green-600 py-3 rounded-xl font-black hover:bg-green-500 disabled:grayscale text-lg shadow-lg shadow-green-900/50">開始戰鬥</button>
                      </div>
                   ) : <div className="text-center animate-pulse text-neutral-400">等待指揮官開始...</div>}
                </div>
             </div>
           );
        };

        const GameView = ({ myUid, players, question, onAnswer, targetMode, onAttack, feedback }) => {
           const me = players[myUid];
           const opponents = Object.values(players).filter(p => p.uid !== myUid);

           if (!me || me.status === 'dead') return (
              <div className="fixed inset-0 bg-neutral-950 flex flex-col items-center justify-center text-white z-50">
                 <Skull className="w-24 h-24 text-neutral-700 mb-4 animate-bounce" />
                 <h2 className="text-4xl font-black text-red-600 mb-2">已陣亡</h2>
                 <p className="text-neutral-500">勝敗乃兵家常事，大俠請重新來過</p>
              </div>
           );

           return (
              <div className="fixed inset-0 bg-neutral-950 text-white flex flex-col bg-[url('https://images.unsplash.com/photo-1599058945522-28d584b6f0ff?q=80&w=2069&auto=format&fit=crop')] bg-cover bg-center">
                 <div className="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>
                 
                 <div className="relative z-10 flex-none p-4 bg-neutral-900/60 border-b border-white/10 flex justify-center gap-3 overflow-x-auto">
                    {opponents.map(op => (
                       <button key={op.uid} disabled={!targetMode || op.status === 'dead'} onClick={() => targetMode && onAttack(op.uid)}
                          className={`relative p-3 rounded-xl border transition-all w-24 md:w-32 flex flex-col items-center flex-shrink-0 ${targetMode && op.status !== 'dead' ? 'border-red-500 bg-red-900/30 scale-105 shadow-[0_0_20px_rgba(220,38,38,0.5)] animate-pulse cursor-crosshair' : 'border-neutral-700 bg-black/40'} ${op.status === 'dead' ? 'opacity-30 grayscale' : ''}`}>
                          <div className="text-xs font-bold truncate w-full text-center mb-2 text-neutral-300">{op.name}</div>
                          <div className="w-full h-2 bg-neutral-800 rounded-full overflow-hidden mb-1 ring-1 ring-white/10">
                             <div className="h-full bg-gradient-to-r from-red-600 to-red-400 hp-transition" style={{width: `${(op.hp / op.maxHp) * 100}%`}}></div>
                          </div>
                          <div className="text-[10px] text-neutral-400 font-mono">{op.hp}/{op.maxHp}</div>
                          {targetMode && op.status !== 'dead' && <div className="absolute -bottom-3 bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-lg animate-bounce">點擊攻擊</div>}
                       </button>
                    ))}
                 </div>
                 
                 <div className="relative z-10 flex-1 flex flex-col justify-center p-6 overflow-y-auto w-full max-w-4xl mx-auto">
                    {targetMode ? (
                        <div className="text-center animate-pop">
                            <Swords className="w-24 h-24 text-red-500 mx-auto mb-4 animate-pulse" />
                            <h2 className="text-3xl font-black text-white mb-2">攻擊機會！</h2>
                            <p className="text-neutral-400">請點擊上方的一位對手進行攻擊</p>
                        </div>
                    ) : (
                        <QuestionCard 
                            question={question} 
                            onAnswer={onAnswer} 
                            feedback={feedback}
                            disabled={!!feedback}
                        />
                    )}
                 </div>

                 <div className="relative z-10 flex-none p-4 bg-neutral-900/90 border-t border-white/10">
                    <div className="max-w-4xl mx-auto flex items-center gap-4">
                       <div className="w-14 h-14 bg-gradient-to-br from-blue-600 to-blue-900 rounded-2xl flex items-center justify-center border border-blue-400/50 font-bold shadow-lg text-xl">我</div>
                       <div className="flex-1">
                          <div className="flex justify-between items-end mb-2">
                             <span className="font-bold text-lg text-white">{me.name}</span>
                             <span className="text-xs font-bold text-yellow-500 bg-yellow-900/30 px-2 py-0.5 rounded border border-yellow-500/30">ATK: {me.atk}</span>
                          </div>
                          <div className="w-full h-5 bg-neutral-800 rounded-full overflow-hidden border border-neutral-600 relative shadow-inner">
                             <div className="h-full bg-gradient-to-r from-blue-500 to-cyan-400 hp-transition" style={{width: `${(me.hp / me.maxHp) * 100}%`}}></div>
                             <div className="absolute inset-0 flex items-center justify-center text-xs font-bold text-white shadow-black drop-shadow-md tracking-wider">{me.hp} / {me.maxHp}</div>
                          </div>
                       </div>
                    </div>
                 </div>
              </div>
           );
        };

        const App = () => {
           const [user, setUser] = useState(null);
           const [userData, setUserData] = useState(DEFAULT_USER_DATA);
           const [view, setView] = useState('loading'); 
           
           const [roomCode, setRoomCode] = useState('');
           const [roomData, setRoomData] = useState(null);
           const [myQuestion, setMyQuestion] = useState(null);
           const [targetMode, setTargetMode] = useState(false);
           const [feedback, setFeedback] = useState(null);

           const [showGacha, setShowGacha] = useState(false);
           const [showInv, setShowInv] = useState(false);
           const [showTraining, setShowTraining] = useState(false);

           const aiInterval = useRef(null);
           const aiState = useRef({});

           useEffect(() => {
              const init = async () => {
                 if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                 else await signInAnonymously(auth);
              };
              init();
              return onAuthStateChanged(auth, u => {
                 if (u) {
                    setUser(u);
                    setUserData(loadUserData());
                    setView('menu');
                 }
              });
           }, []);

           useEffect(() => {
              if (!roomCode || !user) return;
              const unsub = onSnapshot(getDocRef(ROOM_COLLECTION, roomCode), (snap) => {
                 if (snap.exists()) {
                    const d = snap.data();
                    setRoomData(d);
                    if (view === 'lobby' && d.status === 'playing') {
                       setView('game');
                       setMyQuestion(getRandomQuestion());
                    }
                 }
              });
              return () => unsub();
           }, [roomCode, user, view]);

           useEffect(() => {
              if (view !== 'game' || !roomData || roomData.host !== user?.uid || roomData.status !== 'playing') {
                 if (aiInterval.current) { clearInterval(aiInterval.current); aiInterval.current = null; }
                 return;
              }
              if (!aiInterval.current) {
                 aiInterval.current = setInterval(async () => {
                    const snap = await getDoc(getDocRef(ROOM_COLLECTION, roomCode));
                    if (!snap.exists()) return;
                    const rd = snap.data();
                    if (rd.status !== 'playing') return;

                    const players = rd.players;
                    const ais = Object.values(players).filter(p => p.isAI && p.status === 'alive');
                    if (ais.length === 0) return;

                    const now = Date.now();
                    let updates = {};
                    let hasUpdate = false;

                    ais.forEach(ai => {
                       if (!aiState.current[ai.uid]) aiState.current[ai.uid] = now + 2000 + Math.random() * 3000;
                       
                       if (now >= aiState.current[ai.uid]) {
                          const willAttack = Math.random() < 0.5; 
                          if (willAttack) {
                             const targets = Object.values(players).filter(p => p.uid !== ai.uid && p.status === 'alive');
                             if (targets.length > 0) {
                                const humans = targets.filter(p => !p.isAI);
                                const bots = targets.filter(p => p.isAI);
                                let target = null;
                                const preferHuman = Math.random() < 0.7;
                                if (preferHuman) {
                                   if(humans.length > 0) target = humans[Math.floor(Math.random()*humans.length)];
                                   else if(bots.length > 0) target = bots[Math.floor(Math.random()*bots.length)];
                                } else {
                                   if(bots.length > 0) target = bots[Math.floor(Math.random()*bots.length)];
                                   else if(humans.length > 0) target = humans[Math.floor(Math.random()*humans.length)];
                                }

                                if (target) {
                                   const curHp = updates[`players.${target.uid}.hp`] ?? target.hp;
                                   const dmg = ai.atk;
                                   const newHp = Math.max(0, curHp - dmg);
                                   updates[`players.${target.uid}.hp`] = newHp;
                                   if (newHp <= 0) {
                                      updates[`players.${target.uid}.status`] = 'dead';
                                      updates[`players.${target.uid}.deathTime`] = now;
                                   }
                                   hasUpdate = true;
                                }
                             }
                          }
                          aiState.current[ai.uid] = now + 10000 + Math.random() * 10000; 
                       }
                    });

                    if (hasUpdate) await updateDoc(getDocRef(ROOM_COLLECTION, roomCode), updates);
                 }, 1000);
              }
           }, [view, roomCode, user]);

           useEffect(() => {
              if (view === 'game' && roomData?.status === 'playing') {
                 const me = roomData.players[user.uid];
                 const alive = Object.values(roomData.players).filter(p => p.status === 'alive');
                 
                 if (me && me.status === 'dead') {
                    const rank = alive.length + 1;
                    const pts = [0, 10, 5, 3, 1][rank] || 1;
                    const newData = { ...userData, points: userData.points + pts };
                    setUserData(saveUserData(newData));
                    alert(`您已陣亡！獲得第 ${rank} 名，積分 +${pts}`);
                    resetGame();
                 }

                 if (roomData.host === user.uid && alive.length <= 1) {
                    if (alive.length === 1) {
                       updateDoc(getDocRef(ROOM_COLLECTION, roomCode), { status: 'finished' });
                    } else if (alive.length === 0) {
                       updateDoc(getDocRef(ROOM_COLLECTION, roomCode), { status: 'finished' });
                    }
                 }
              }
              if (view === 'game' && roomData?.status === 'finished') {
                 const me = roomData.players[user.uid];
                 if (me && me.status === 'alive') {
                    const newData = { ...userData, points: userData.points + 10 };
                    setUserData(saveUserData(newData));
                    alert("恭喜獲得冠軍！積分 +10");
                    resetGame();
                 }
              }
           }, [roomData, view]);

           const resetGame = () => {
              setRoomCode('');
              setRoomData(null);
              setMyQuestion(null);
              setTargetMode(false);
              setFeedback(null);
              setView('menu');
              aiState.current = {};
           };

           const handleStart = async (mode, inputCode) => {
              try {
                  const myW = WEAPONS_POOL.find(w => w.id === userData.equipped.weapon);
                  const myA = ARMORS_POOL.find(a => a.id === userData.equipped.armor);
                  const myT = TITLES_POOL.find(t => t.id === userData.equipped.title);
                  const atk = 10 + (myW?.atk || 0);
                  const maxHp = 100 + (myA?.hp || 0);
                  const name = myT ? `[${myT.name}] 玩家` : `玩家`;

                  const equipment = {
                      title: userData.equipped.title || null,
                      weapon: userData.equipped.weapon || null,
                      armor: userData.equipped.armor || null
                  };

                  if (mode === 'create') {
                     const code = Math.floor(100000 + Math.random()*900000).toString();
                     await setDoc(getDocRef(ROOM_COLLECTION, code), {
                        createdAt: Date.now(),
                        host: user.uid,
                        status: 'waiting',
                        players: { [user.uid]: {
                            uid: user.uid,
                            name: name,
                            hp: maxHp,
                            maxHp: maxHp,
                            atk: atk,
                            status: 'alive',
                            isHost: true,
                            isAI: false,
                            equipment: equipment
                        }}
                     });
                     setRoomCode(code);
                     setView('lobby');
                  } else {
                     if(!inputCode) return alert("請輸入代碼");
                     const ref = getDocRef(ROOM_COLLECTION, inputCode);
                     const snap = await getDoc(ref);
                     if (!snap.exists()) return alert("找不到房間");
                     const d = snap.data();
                     if (d.status !== 'waiting') return alert("遊戲已開始");
                     if (Object.keys(d.players).length >= 4) return alert("客滿");
                     
                     await updateDoc(ref, { [`players.${user.uid}`]: {
                        uid: user.uid,
                        name: name + (Object.keys(d.players).length+1),
                        hp: maxHp,
                        maxHp: maxHp,
                        atk: atk,
                        status: 'alive',
                        isHost: false,
                        isAI: false,
                        equipment: equipment
                     }});
                     setRoomCode(inputCode);
                     setView('lobby');
                  }
              } catch (e) {
                  alert("無法建立或加入戰場: " + e.message);
              }
           };

           const handleAddAI = async () => {
              if (!roomCode) return;
              const aiId = "AI_" + Date.now();
              const count = Object.keys(roomData.players).length;
              if (count >= 4) return;
              
              // AI 隨機裝備
              const getRandomItem = (pool) => {
                  const r = Math.random() * 100;
                  let s = 0;
                  for(let i of pool) {
                      s += i.prob;
                      if(r <= s) return i.id;
                  }
                  return pool[pool.length-1].id;
              };

              const aiHp = 100 + Math.floor(Math.random() * 50);
              const aiAtk = 10 + Math.floor(Math.random() * 15);
              
              await updateDoc(getDocRef(ROOM_COLLECTION, roomCode), {
                 [`players.${aiId}`]: {
                    uid: aiId,
                    name: `AI戰士 ${count+1}`,
                    hp: aiHp,
                    maxHp: aiHp,
                    atk: aiAtk,
                    status: 'alive',
                    isAI: true,
                    equipment: { 
                        title: getRandomItem(TITLES_POOL), 
                        weapon: getRandomItem(WEAPONS_POOL), 
                        armor: getRandomItem(ARMORS_POOL) 
                    }
                 }
              });
           };

           const handleAttack = async (targetUid) => {
              setTargetMode(false);
              setMyQuestion(getRandomQuestion());
              const target = roomData.players[targetUid];
              const me = roomData.players[user.uid];
              const newHp = Math.max(0, target.hp - me.atk);
              let updates = { [`players.${targetUid}.hp`]: newHp };
              if (newHp <= 0) {
                 updates[`players.${targetUid}.status`] = 'dead';
                 updates[`players.${targetUid}.deathTime`] = Date.now();
              }
              await updateDoc(getDocRef(ROOM_COLLECTION, roomCode), updates);
           };

           const handleAnswer = (idx) => {
              const isCorrect = idx === myQuestion.ans;
              if (isCorrect) {
                 setTargetMode(true);
              } else {
                 setFeedback({ correct: myQuestion.ans, wrong: idx });
                 setTimeout(() => {
                    setFeedback(null);
                    setMyQuestion(getRandomQuestion());
                 }, 2000);
              }
           };

           const handleGachaComplete = (mode, items) => {
              const itemsArray = Array.isArray(items) ? items : [items];
              const cost = itemsArray.length * 10;
              const newData = { ...userData, points: userData.points - cost };
              const category = mode === 'title' ? 'titles' : mode === 'weapon' ? 'weapons' : 'armors';
              itemsArray.forEach(item => {
                  const currentCount = newData.inventory[category][item.id] || 0;
                  newData.inventory[category][item.id] = currentCount + 1;
              });
              setUserData(saveUserData(newData));
           };

           const handleEquip = (category, itemId) => {
              const newData = { ...userData };
              newData.equipped[category] = itemId;
              setUserData(saveUserData(newData));
           };

           const handleTrainingPoints = (pts) => {
               const newData = { ...userData, points: userData.points + pts };
               setUserData(saveUserData(newData));
           };

           if (view === 'loading') return <LoadingView />;

           return (
              <>
                 {view === 'menu' && (
                    <MenuView 
                        userData={userData} 
                        onStart={handleStart} 
                        onGacha={() => setShowGacha(true)} 
                        onInv={() => setShowInv(true)} 
                        onTraining={() => setShowTraining(true)} 
                        onReset={() => { localStorage.removeItem(STORAGE_KEY); window.location.reload(); }} 
                    />
                 )}
                 {view === 'lobby' && roomData && <LobbyView roomCode={roomCode} players={roomData.players} isHost={roomData.host === user.uid} onStart={() => updateDoc(getDocRef(ROOM_COLLECTION, roomCode), {status:'playing'})} onAddAI={handleAddAI} onLeave={resetGame} />}
                 {view === 'game' && roomData && <GameView myUid={user.uid} players={roomData.players} question={myQuestion} onAnswer={handleAnswer} targetMode={targetMode} onAttack={handleAttack} feedback={feedback} />}
                 
                 {showGacha && <GachaModal userPoints={userData.points} onClose={() => setShowGacha(false)} onComplete={handleGachaComplete} />}
                 {showInv && <InventoryModal userData={userData} onEquip={handleEquip} onClose={() => setShowInv(false)} />}
                 {showTraining && <TrainingView onClose={() => setShowTraining(false)} onAddPoints={handleTrainingPoints} />}
              </>
           );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
