        );

        const MenuView = ({ currentTitle, localScore, createRoom, inputCode, setInputCode, joinRoom, errorMsg, handleResetScore }) => (
          <div className="fixed inset-0 bg-neutral-950 text-white flex flex-col items-center justify-center p-6 overflow-hidden">
            <div className="absolute inset-0 bg-gradient-to-br from-red-900 via-orange-950 to-neutral-950"></div>
            <div className="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
            <div className="absolute top-1/4 left-1/4 w-32 h-32 bg-red-600 rounded-full blur-[80px] animate-pulse opacity-50"></div>
            <div className="absolute bottom-1/4 right-1/4 w-40 h-40 bg-orange-600 rounded-full blur-[80px] animate-pulse opacity-50 delay-700"></div>

            <div className="z-10 w-full max-w-lg flex flex-col items-center gap-8">
              <header className="text-center transform hover:scale-105 transition duration-500">
                <h1 className="text-6xl font-black italic tracking-wider text-transparent bg-clip-text bg-gradient-to-t from-red-500 via-orange-400 to-yellow-300 flex items-center gap-3 justify-center mb-2 drop-shadow-[0_5px_5px_rgba(220,38,38,0.8)]">
                  <Flame className="w-12 h-12 text-red-500 fill-orange-500 animate-bounce" />
                  知識就是力量
                </h1>
                <p className="text-orange-200 text-lg font-bold tracking-widest uppercase">Knowledge is Power</p>
              </header>

              <div className="w-full bg-black/40 backdrop-blur-md border border-red-500/30 rounded-3xl p-8 shadow-[0_0_30px_rgba(220,38,38,0.2)]">
                <div className="flex justify-between items-center mb-6">
                  <span className="text-red-300 text-lg font-bold">你的稱號</span>
                  <Trophy className="w-8 h-8 text-yellow-500" />
                </div>
                <h2 className="text-4xl font-bold text-white mb-2 drop-shadow-md">{currentTitle}</h2>
                <div className="flex items-center justify-between mb-4">
                   <div className="text-neutral-400 text-base flex items-center">
                     戰力積分: <span className="text-red-400 font-mono text-2xl ml-2 font-black">{localScore}</span>
                     <button onClick={handleResetScore} className="ml-3 p-1 text-neutral-600 hover:text-red-500 transition-colors" title="清除積分">
                        <Trash2 className="w-4 h-4" />
                     </button>
                   </div>
                   <div className="text-xs text-neutral-500 flex items-center gap-1" title="積分會在獲得後 80 分鐘失效">
                     <History className="w-3 h-3" /> 80分鐘後過期
                   </div>
                </div>
                <div className="w-full bg-neutral-800 h-4 rounded-full overflow-hidden border border-neutral-700">
                  <div className="bg-gradient-to-r from-red-600 to-orange-500 h-full transition-all duration-500 shadow-[0_0_15px_rgba(234,88,12,0.8)]" 
                    style={{ width: `${(localScore % 10) * 10}%` }}></div>
                </div>
                <p className="text-xs text-right text-neutral-500 mt-2">下一階還需 {10 - (localScore % 10)} 分</p>
              </div>

              <div className="w-full space-y-4">
                <button onClick={createRoom} className="w-full bg-gradient-to-r from-red-700 to-orange-700 hover:from-red-600 hover:to-orange-600 text-white font-black py-5 px-6 rounded-2xl shadow-lg border-b-4 border-red-900 transform transition active:scale-[0.98] active:border-b-0 flex items-center justify-center gap-3 text-xl tracking-wider">
                  <Swords className="w-6 h-6" /> 建立戰場
                </button>
                <div className="relative py-2">
                  <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-white/10"></div></div>
                  <div className="relative flex justify-center text-sm"><span className="px-4 bg-transparent text-neutral-500 uppercase tracking-widest font-bold">VS</span></div>
                </div>
                <div className="flex gap-3">
                  <input type="number" placeholder="輸入代碼" className="flex-1 bg-black/50 border-2 border-red-900/50 rounded-2xl px-6 py-4 text-white placeholder-neutral-600 focus:outline-none focus:border-red-500 text-center text-xl font-mono tracking-widest transition-colors"
                    value={inputCode} onChange={(e) => setInputCode(e.target.value)} maxLength={6} />
                  <button onClick={joinRoom} disabled={!inputCode} className="bg-neutral-800 hover:bg-neutral-700 disabled:opacity-50 text-white font-bold py-4 px-8 rounded-2xl transition text-lg border-2 border-neutral-700">加入</button>
                </div>
              </div>
              {errorMsg && <div className="bg-red-900/50 text-red-200 px-6 py-3 rounded-xl text-base border border-red-500/50 w-full text-center backdrop-blur">{errorMsg}</div>}
            </div>
          </div>
        );

        const LobbyView = ({ roomCode, lobbyTimer, resetToMenu, assignAI }) => (
          <div className="fixed inset-0 bg-neutral-950 text-white p-6 flex flex-col items-center justify-center">
            <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-red-900/40 via-neutral-950 to-neutral-950"></div>
            <div className="relative bg-black/60 backdrop-blur-xl p-10 rounded-3xl w-full max-w-xl text-center shadow-[0_0_50px_rgba(220,38,38,0.15)] border border-red-900/30">
              <div className="relative w-24 h-24 mx-auto mb-8">
                 <div className="absolute inset-0 animate-ping rounded-full bg-red-500/20"></div>
                 <div className="relative z-10 w-full h-full rounded-full border-4 border-red-600 border-t-transparent animate-spin"></div>
                 <Swords className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-8 h-8 text-red-500" />
              </div>
              <h2 className="text-3xl font-black mb-3 tracking-wide">等待挑戰者</h2>
              <p className="text-neutral-400 mb-8 text-lg">大戰一觸即發...</p>
              <div className="bg-black/80 border-2 border-red-900 p-6 rounded-2xl mb-8 relative group">
                 <div className="text-6xl font-mono font-bold tracking-[0.3em] text-red-500 select-all drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]">{roomCode}</div>
                 <p className="text-sm text-neutral-500 mt-4 flex items-center justify-center gap-2">
                   <Clock className="w-4 h-4" /> {lobbyTimer > 0 ? `${lobbyTimer} 秒後自動指派 AI 對手` : 'AI 進場中...'}
                 </p>
              </div>
              <div className="flex items-center justify-center gap-3 text-neutral-400 text-base bg-white/5 py-3 rounded-full mb-8">
                <Users className="w-5 h-5" /> <span>1/2 戰士就位</span>
              </div>
              
              <div className="flex flex-col gap-4 w-full max-w-xs mx-auto">
                 <button 
                     onClick={assignAI}
                     className="w-full bg-gradient-to-r from-purple-700 to-pink-700 hover:from-purple-600 hover:to-pink-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg flex items-center justify-center gap-2 transition transform active:scale-95"
                 >
                     <Bot className="w-5 h-5" /> 直接挑戰 AI
                 </button>

                 <button onClick={resetToMenu} className="text-neutral-500 hover:text-white hover:underline decoration-red-600 text-lg transition">撤退</button>
              </div>
            </div>
          </div>
        );

        const GameView = ({ myHp, opHp, isAI, myQuestion, handleAnswer, feedback, isFrozen }) => (
          <div className="fixed inset-0 bg-neutral-950 text-white flex flex-col w-full h-full">
            {/* Header */}
            <div className="p-4 md:p-6 bg-black/80 border-b border-red-900/50 shadow-lg z-10 flex-none backdrop-blur-sm">
              <div className="flex justify-between items-center max-w-4xl mx-auto">
                <div className="flex flex-col items-center gap-2">
                  <div className="flex items-center gap-2">
                     <span className="text-blue-400 font-black text-xl md:text-2xl drop-shadow-[0_0_8px_rgba(59,130,246,0.8)]">你</span>
                     <span className="text-neutral-500 font-mono font-bold">HP {myHp}</span>
                  </div>
                  <div className="flex gap-1 md:gap-2">
                    {[...Array(5)].map((_, i) => (
                      <div key={i} className={`transition-all duration-300 ${i < myHp ? 'scale-100' : 'scale-50 grayscale opacity-30'}`}>
                         <Heart className={`w-6 h-6 md:w-8 md:h-8 ${i < myHp ? 'fill-blue-600 text-blue-500' : 'text-neutral-700'}`} />
                      </div>
                    ))}
                  </div>
                </div>
                <div className="flex flex-col items-center"><span className="text-red-600 font-black text-3xl italic">VS</span></div>
                <div className="flex flex-col items-center gap-2">
                  <div className="flex items-center gap-2">
                     <span className="text-neutral-500 font-mono font-bold">HP {opHp}</span>
                     <span className="text-red-500 font-black text-xl md:text-2xl drop-shadow-[0_0_8px_rgba(239,68,68,0.8)]">{isAI ? 'AI魔王' : '對手'}</span>
                     {isAI && <Bot className="w-6 h-6 text-purple-500 animate-pulse" />}
                  </div>
                  <div className="flex gap-1 md:gap-2">
                    {[...Array(5)].map((_, i) => (
                      <div key={i} className={`transition-all duration-300 ${i < opHp ? 'scale-100' : 'scale-50 grayscale opacity-30'}`}>
                         <Heart className={`w-6 h-6 md:w-8 md:h-8 ${i < opHp ? 'fill-red-600 text-red-500' : 'text-neutral-700'}`} />
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            {/* Indicator */}
            <div className="py-2 text-center text-sm md:text-base font-bold bg-gradient-to-r from-red-900/50 via-orange-900/50 to-red-900/50 backdrop-blur border-b border-red-900/30 text-yellow-200 flex-none animate-pulse">
              {isFrozen ? "冷卻中... 觀察正確答案！" : (isAI ? "警告：AI 每 10 秒自動攻擊！" : "即時對戰！答對扣對方血量！")}
            </div>

            {/* Question Area */}
            <div className="flex-1 p-4 md:p-8 flex flex-col justify-center max-w-5xl mx-auto w-full overflow-y-auto relative">
              <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/diagmonds-light.png')] opacity-5 pointer-events-none"></div>
              <div className="bg-neutral-900/90 rounded-3xl p-6 md:p-10 shadow-[0_0_40px_rgba(0,0,0,0.5)] border border-neutral-800 mb-6 md:mb-10 flex-none relative overflow-hidden">
                <div className="absolute top-0 left-0 w-2 h-full bg-gradient-to-b from-blue-500 to-purple-600"></div>
                <div className="flex justify-center mb-6">
                  <div className="bg-neutral-800 p-4 rounded-full border border-neutral-700">
                    <BookOpen className="w-8 h-8 md:w-10 md:h-10 text-blue-400" />
                  </div>
                </div>
                <h3 className="text-2xl md:text-3xl lg:text-4xl font-bold text-center leading-relaxed md:leading-relaxed text-neutral-100">
                  {myQuestion?.q || "準備題目中..."}
                </h3>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 flex-none">
                {myQuestion?.options.map((opt, idx) => {
                  let btnClass = "p-6 md:p-8 rounded-2xl text-xl md:text-2xl font-bold border-2 transition-all transform shadow-lg bg-neutral-800 text-neutral-300 border-neutral-700";
                  
                  // Feedback Logic
                  if (feedback) {
                    if (idx === feedback.correctIndex) {
                      btnClass = "p-6 md:p-8 rounded-2xl text-xl md:text-2xl font-bold border-2 shadow-lg bg-green-900/80 text-green-100 border-green-500 scale-105"; // Correct Answer
                    } else if (idx === feedback.wrongIndex) {
                      btnClass = "p-6 md:p-8 rounded-2xl text-xl md:text-2xl font-bold border-2 shadow-lg bg-red-900/80 text-red-100 border-red-500 opacity-80"; // Wrong Selection
                    } else {
                      btnClass += " opacity-30 cursor-not-allowed"; // Other options
                    }
                  } else {
                    btnClass += " hover:bg-neutral-700 hover:text-white hover:border-blue-500 hover:shadow-[0_0_20px_rgba(59,130,246,0.3)] active:scale-[0.95]";
                  }

                  return (
                    <button
                      key={idx}
                      onClick={() => handleAnswer(idx)}
                      disabled={isFrozen}
                      className={btnClass}
                    >
                      <div className="flex items-center justify-center gap-2">
                        {feedback && idx === feedback.correctIndex && <CheckCircle className="w-6 h-6 text-green-400"/>}
                        {feedback && idx === feedback.wrongIndex && <XCircle className="w-6 h-6 text-red-400"/>}
                        {opt}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        );

        const ResultView = ({ iWon, isAI, scoreEarned, localScore, resetToMenu }) => (
          <div className="fixed inset-0 bg-neutral-950 text-white p-6 flex flex-col items-center justify-center overflow-hidden">
            <div className={`absolute inset-0 bg-gradient-to-b ${iWon ? 'from-yellow-900/20 to-neutral-950' : 'from-gray-900/50 to-neutral-950'}`}></div>
            <div className="relative w-full max-w-lg">
              {iWon && (
                 <div className="absolute -top-32 left-1/2 transform -translate-x-1/2 z-20">
                    <Crown className="w-40 h-40 text-yellow-400 drop-shadow-[0_0_30px_rgba(250,204,21,0.8)] animate-bounce" />
                 </div>
              )}
              <div className="bg-black/80 backdrop-blur-xl p-10 rounded-3xl w-full text-center shadow-[0_0_60px_rgba(0,0,0,0.8)] border border-white/10 overflow-hidden relative">
                <div className={`absolute top-0 left-0 w-full h-2 ${iWon ? 'bg-gradient-to-r from-yellow-400 via-orange-500 to-yellow-400 animate-pulse' : 'bg-neutral-700'}`}></div>
                <h2 className={`text-6xl font-black mb-4 tracking-wider italic ${iWon ? 'text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 to-yellow-600' : 'text-neutral-500'}`}>
                  {iWon ? 'VICTORY' : 'DEFEAT'}
                </h2>
                <p className="text-neutral-400 mb-10 text-xl font-bold">
                  {iWon ? (isAI ? '你成功討伐了 AI 魔王！' : '你擊潰了對手！') : '勝敗乃兵家常事，大俠請重新來過。'}
                </p>
                <div className="flex justify-center gap-4 mb-10">
                  <div className="bg-neutral-900/80 p-6 rounded-2xl flex flex-col items-center flex-1 border border-neutral-800">
                    <span className="text-neutral-500 text-sm mb-2 font-bold uppercase">本次獲得</span>
                    <span className={`text-5xl font-mono font-black ${iWon ? 'text-green-400' : 'text-neutral-600'}`}>+{scoreEarned}</span>
                    <span className="text-xs text-neutral-600 mt-1">{iWon ? '(剩餘 HP)' : '(戰敗)'}</span>
                  </div>
                  <div className="bg-neutral-900/80 p-6 rounded-2xl flex flex-col items-center flex-1 border border-neutral-800">
                    <span className="text-neutral-500 text-sm mb-2 font-bold uppercase">累積戰力</span>
                    <span className="text-5xl font-mono font-black text-yellow-500">{localScore}</span>
                  </div>
                </div>
                <button onClick={resetToMenu} className={`w-full font-black py-5 px-8 rounded-2xl shadow-xl transition text-xl uppercase tracking-widest ${iWon ? 'bg-gradient-to-r from-yellow-600 to-orange-600 hover:from-yellow-500 hover:to-orange-500 text-white' : 'bg-neutral-800 hover:bg-neutral-700 text-neutral-400 hover:text-white'}`}>返回大廳</button>
              </div>
            </div>
          </div>
        );

        // --- Main Controller ---
        function BattleGame() {
          const [user, setUser] = useState(null);
          const [scoreHistory, setScoreHistory] = useState([]);
          const [view, setView] = useState('loading');
          const [roomCode, setRoomCode] = useState('');
          const [inputCode, setInputCode] = useState('');
          const [gameState, setGameState] = useState(null);
          const [errorMsg, setErrorMsg] = useState('');
          const [lobbyTimer, setLobbyTimer] = useState(60);
          const [myQuestion, setMyQuestion] = useState(null);
          
          // Feedback State
          const [feedback, setFeedback] = useState(null); // { correctIndex: number, wrongIndex: number }
          const [isFrozen, setIsFrozen] = useState(false);

          const aiIntervalRef = useRef(null);
          const scoreIntervalRef = useRef(null);

          useEffect(() => {
            const initAuth = async () => {
              try { await signInAnonymously(auth); } 
              catch (e) { console.error("Auth error", e); setErrorMsg("登入失敗：" + e.message); }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, (u) => { if(u) { setUser(u); setScoreHistory(getValidScoreHistory()); setView('menu'); } });
            scoreIntervalRef.current = setInterval(() => {
              const valid = getValidScoreHistory();
              setScoreHistory(valid);
              localStorage.setItem('battle_score_history_v2', JSON.stringify(valid));
            }, 60000);
            return () => { unsubscribe(); if (scoreIntervalRef.current) clearInterval(scoreIntervalRef.current); };
          }, []);

          useEffect(() => {
            if (!user || !roomCode) return;
            const unsubscribe = onSnapshot(doc(db, ...getRoomCollectionPath(), roomCode), (snap) => {
              if (snap.exists()) {
                const data = snap.data();
                setGameState(data);
                if (data.status === 'waiting') setView('lobby');
                if (data.status === 'playing') { setView('game'); setMyQuestion(prev => prev || getRandomQuestion()); }
                if (data.status === 'finished') setView('result');
              } else { setErrorMsg("房間不存在或已關閉"); setView('menu'); }
            }, (e) => { console.error("Snapshot error:", e); setErrorMsg("連線中斷"); });
            return () => unsubscribe();
          }, [user, roomCode]);

          useEffect(() => {
            let timer = null;
            if (view === 'lobby' && gameState?.status === 'waiting' && gameState?.host === user?.uid) {
              timer = setInterval(() => {
                setLobbyTimer((prev) => {
                  if (prev <= 1) { clearInterval(timer); assignAI(); return 0; }
                  return prev - 1;
                });
              }, 1000);
            } else { setLobbyTimer(60); }
            return () => { if (timer) clearInterval(timer); };
          }, [view, gameState?.status, user?.uid]);

          useEffect(() => {
            if (view === 'game' && gameState?.player2 === 'AI_BOT' && gameState?.host === user?.uid && gameState?.status === 'playing') {
              if (aiIntervalRef.current) clearInterval(aiIntervalRef.current);
              aiIntervalRef.current = setInterval(async () => {
                const ref = doc(db, ...getRoomCollectionPath(), roomCode);
                const snap = await getDoc(ref);
                if (snap.exists() && snap.data().status === 'playing') {
                   const newHp = Math.max(0, snap.data().hostHp - 1);
                   const updates = { hostHp: newHp };
                   if (newHp === 0) updates.status = 'finished';
                   await updateDoc(ref, updates);
                }
              }, 10000);
            }
            return () => { if (aiIntervalRef.current) clearInterval(aiIntervalRef.current); };
          }, [view, gameState?.player2, gameState?.status, user?.uid, roomCode]);

          const localScore = calculateTotalScore(scoreHistory);
          const currentTitle = TITLES[Math.min(Math.floor(localScore / 10), 19)];
          const isHost = gameState && gameState.host === user?.uid;
          const isAI = gameState?.player2 === 'AI_BOT';
          const myRole = isHost ? 'host' : (gameState?.player2 === user?.uid ? 'player2' : 'spectator');
          const myHp = myRole === 'host' ? gameState?.hostHp : gameState?.player2Hp;
          const opHp = myRole === 'host' ? gameState?.player2Hp : gameState?.hostHp;

          const createRoom = async () => {
            if (!user) return;
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            await setDoc(doc(db, ...getRoomCollectionPath(), code), { host: user.uid, player2: null, hostHp: 5, player2Hp: 5, status: 'waiting', createdAt: Date.now() });
            setRoomCode(code);
          };
          const assignAI = async () => { if (!roomCode) return; await updateDoc(doc(db, ...getRoomCollectionPath(), roomCode), { player2: 'AI_BOT', status: 'playing' }); };
          const joinRoom = async () => {
            if (!inputCode) return;
            const ref = doc(db, ...getRoomCollectionPath(), inputCode);
            const snap = await getDoc(ref);
            if (snap.exists()) {
              const data = snap.data();
              if (data.status === 'waiting' && !data.player2) { await updateDoc(ref, { player2: user.uid, status: 'playing' }); setRoomCode(inputCode); }
              else setErrorMsg("房間已滿或遊戲進行中");
            } else setErrorMsg("找不到房間");
          };

          const handleAnswer = async (index) => {
            if (isFrozen || gameState.status !== 'playing') return;

            const isCorrect = index === myQuestion.ans;

            if (isCorrect) {
              const ref = doc(db, ...getRoomCollectionPath(), roomCode);
              let updates = {};
              if (myRole === 'host') {
                const newHp = Math.max(0, gameState.player2Hp - 1);
                updates.player2Hp = newHp;
                if (newHp === 0) updates.status = 'finished';
              } else {
                const newHp = Math.max(0, gameState.hostHp - 1);
                updates.hostHp = newHp;
                if (newHp === 0) updates.status = 'finished';
              }
              await updateDoc(ref, updates);
              setMyQuestion(getRandomQuestion());
            } else {
              setIsFrozen(true);
              setFeedback({ correctIndex: myQuestion.ans, wrongIndex: index });
              
              setTimeout(() => {
                setIsFrozen(false);
                setFeedback(null);
                setMyQuestion(getRandomQuestion());
              }, 5000);
            }
          };

          const handleResetScore = () => {
            const pwd = prompt("請輸入密碼以清除積分");
            if (pwd === "7772041") {
                localStorage.removeItem('battle_score_history_v2');
                setScoreHistory([]);
                alert("積分已清除");
            } else if (pwd !== null) {
                alert("密碼錯誤");
            }
          };

          const resetToMenu = () => {
            setRoomCode(''); setGameState(null); setInputCode(''); setErrorMsg('');
            setView('menu'); setLobbyTimer(60); setMyQuestion(null); setFeedback(null); setIsFrozen(false);
            setScoreHistory(getValidScoreHistory());
          };

          if (view === 'loading') return <LoadingView errorMsg={errorMsg} />;
          if (view === 'menu') return <MenuView currentTitle={currentTitle} localScore={localScore} createRoom={createRoom} inputCode={inputCode} setInputCode={setInputCode} joinRoom={joinRoom} errorMsg={errorMsg} handleResetScore={handleResetScore} />;
          if (view === 'lobby') return <LobbyView roomCode={roomCode} lobbyTimer={lobbyTimer} resetToMenu={resetToMenu} assignAI={assignAI} />;
          if (view === 'game') return <GameView myHp={myHp} opHp={opHp} isAI={isAI} myQuestion={myQuestion} handleAnswer={handleAnswer} feedback={feedback} isFrozen={isFrozen} />;
          if (view === 'result') {
             const iWon = (myRole === 'host' && gameState.player2Hp === 0) || (myRole === 'player2' && gameState.hostHp === 0);
             if (iWon && sessionStorage.getItem('last_processed_game_v2') !== roomCode) {
               const points = myHp || 0;
               if (points > 0) { const h = saveScore(points); setScoreHistory(h); }
               sessionStorage.setItem('last_processed_game_v2', roomCode);
             }
             return <ResultView iWon={iWon} isAI={isAI} scoreEarned={iWon ? myHp : 0} localScore={calculateTotalScore(scoreHistory)} resetToMenu={resetToMenu} />;
          }
          return null;
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<BattleGame />);
    </script>
</body>
</html>
