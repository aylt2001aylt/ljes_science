              if (humansCount >= 4) return;
              
              const aiId = "AI_" + Date.now();
              const getRandomItem = (pool) => {
                  const r = Math.random() * 100;
                  let s = 0;
                  for(let i of pool) {
                      s += i.prob;
                      if(r <= s) return i.id;
                  }
                  return pool[pool.length-1].id;
              };

              const aiRaceId = getRandomItem(RACES_POOL);
              const aiRace = RACES_POOL.find(r => r.id === aiRaceId);
              
              const baseHp = 100 + Math.floor(Math.random() * 50);
              const baseAtk = 10 + Math.floor(Math.random() * 15);
              
              const aiHp = baseHp + (aiRace?.hp || 0);
              const aiAtk = baseAtk + (aiRace?.atk || 0);
              
              await updateDoc(getDocRef(ROOM_COLLECTION, roomCode), {
                 [`players.${aiId}`]: {
                    uid: aiId,
                    name: `AI戰士 ${humansCount+1}`,
                    hp: aiHp,
                    maxHp: aiHp,
                    atk: aiAtk,
                    status: 'alive',
                    isAI: true,
                    isBoss: false,
                    equipment: { 
                        title: getRandomItem(TITLES_POOL), 
                        weapon: getRandomItem(WEAPONS_POOL), 
                        armor: getRandomItem(ARMORS_POOL),
                        race: aiRaceId
                    }
                 }
              });
           };

           const handleAttack = async (targetUid) => {
              setTargetMode(false);
              setMyQuestion(getRandomQuestion());
              const target = roomData.players[targetUid];
              const me = roomData.players[user.uid];
              const newHp = Math.max(0, target.hp - me.atk);
              let updates = { [`players.${targetUid}.hp`]: newHp };
              if (newHp <= 0) {
                 updates[`players.${targetUid}.status`] = 'dead';
                 updates[`players.${targetUid}.deathTime`] = Date.now();
              }
              await updateDoc(getDocRef(ROOM_COLLECTION, roomCode), updates);
           };

           const handleHeal = async () => {
              setTargetMode(false);
              setMyQuestion(getRandomQuestion());
              const me = roomData.players[user.uid];
              const healAmount = me.atk * 2;
              const newHp = Math.min(me.maxHp, me.hp + healAmount);
              let updates = { [`players.${user.uid}.hp`]: newHp };
              await updateDoc(getDocRef(ROOM_COLLECTION, roomCode), updates);
           };

           const handleAnswer = (idx) => {
              const isCorrect = idx === myQuestion.ans;
              if (isCorrect) {
                 setTargetMode(true);
              } else {
                 setFeedback({ correct: myQuestion.ans, wrong: idx });
                 setTimeout(() => {
                    setFeedback(null);
                    setMyQuestion(getRandomQuestion());
                 }, 2000);
              }
           };

           const handleGachaComplete = (mode, items) => {
              const itemsArray = Array.isArray(items) ? items : [items];
              const cost = itemsArray.length * 10;
              const newData = { ...userData, points: userData.points - cost };
              
              let category = 'titles';
              if (mode === 'weapon') category = 'weapons';
              else if (mode === 'armor') category = 'armors';
              else if (mode === 'race') category = 'races';

              itemsArray.forEach(item => {
                  const currentCount = newData.inventory[category][item.id] || 0;
                  newData.inventory[category][item.id] = currentCount + 1;
              });
              setUserData(saveUserData(newData));
           };

           const handleEquip = (category, itemId) => {
              const newData = { ...userData };
              newData.equipped[category] = itemId;
              setUserData(saveUserData(newData));
           };

           const handleTrainingPoints = (pts) => {
               const newData = { ...userData, points: userData.points + pts };
               setUserData(saveUserData(newData));
           };

           // 處理回收裝備
           const handleRecycle = (category, itemId, amount, pointsGained) => {
               const newData = { ...userData };
               let invKey = category === 'title' ? 'titles' : category + 's';
               if (category === 'race') invKey = 'races';

               newData.inventory[invKey][itemId] -= amount;
               if (newData.inventory[invKey][itemId] <= 0) {
                   delete newData.inventory[invKey][itemId];
               }
               newData.knowledgePoints = (newData.knowledgePoints || 0) + pointsGained;
               setUserData(saveUserData(newData));
           };

           // 處理藏寶庫購買
           const handleBuyVault = (category, itemId, cost) => {
               const newData = { ...userData };
               let invKey = category === 'title' ? 'titles' : category + 's';
               if (category === 'race') invKey = 'races';
               
               if ((newData.knowledgePoints || 0) >= cost) {
                   newData.knowledgePoints -= cost;
                   newData.inventory[invKey][itemId] = (newData.inventory[invKey][itemId] || 0) + 1;
                   setUserData(saveUserData(newData));
               }
           };

           if (view === 'loading') return <LoadingView />;

           return (
              <>
                 {view === 'menu' && (
                    <MenuView 
                        userData={userData} 
                        onStart={handleStart} 
                        onGacha={() => setShowGacha(true)} 
                        onInv={() => setShowInv(true)} 
                        onTraining={() => setShowTraining(true)} 
                        onReset={() => setShowResetConfirm(true)} 
                        onOpenRecycler={() => setShowRecycler(true)}
                        onOpenVault={() => setShowVault(true)}
                    />
                 )}
                 {view === 'lobby' && roomData && <LobbyView roomCode={roomCode} roomType={roomData.type || 'br'} players={roomData.players} isHost={roomData.host === user.uid} onStart={() => updateDoc(getDocRef(ROOM_COLLECTION, roomCode), {status:'playing'})} onAddAI={handleAddAI} onLeave={resetGame} />}
                 {view === 'game' && roomData && <GameView roomType={roomData.type || 'br'} myUid={user.uid} players={roomData.players} question={myQuestion} onAnswer={handleAnswer} targetMode={targetMode} onAttack={handleAttack} onHeal={handleHeal} feedback={feedback} />}
                 
                 {showGacha && <GachaModal userPoints={userData.points} onClose={() => setShowGacha(false)} onComplete={handleGachaComplete} />}
                 {showInv && <InventoryModal userData={userData} onEquip={handleEquip} onClose={() => setShowInv(false)} />}
                 {showTraining && <TrainingView onClose={() => setShowTraining(false)} onAddPoints={handleTrainingPoints} />}
                 {showResetConfirm && <ResetConfirmModal onConfirm={() => { localStorage.removeItem(STORAGE_KEY); window.location.reload(); }} onCancel={() => setShowResetConfirm(false)} />}
                 
                 {showRecycler && <RecyclerModal userData={userData} onRecycle={handleRecycle} onClose={() => setShowRecycler(false)} />}
                 {showVault && <VaultModal userData={userData} onBuy={handleBuyVault} onClose={() => setShowVault(false)} />}
              </>
           );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
