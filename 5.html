                  <div>
                      <h2 className="text-xl font-bold text-green-400 flex items-center gap-2"><RefreshCw /> 神秘回收商</h2>
                      <div className="text-xs text-neutral-400 mt-1 flex items-center gap-1">您擁有: <BookMarked size={12} className="text-purple-400"/> {userData.knowledgePoints} 知識點</div>
                  </div>
                  <button onClick={onClose}><XCircle className="text-neutral-500 hover:text-white" /></button>
                </div>
                <div className="flex p-2 gap-2 bg-neutral-950 overflow-x-auto">
                  <button onClick={() => setTab('race')} className={`flex-1 py-2 px-3 whitespace-nowrap rounded-lg text-sm font-bold ${tab === 'race' ? 'bg-green-900/50 text-green-200 border border-green-800' : 'text-neutral-500'}`}>種族</button>
                  <button onClick={() => setTab('weapon')} className={`flex-1 py-2 px-3 whitespace-nowrap rounded-lg text-sm font-bold ${tab === 'weapon' ? 'bg-green-900/50 text-green-200 border border-green-800' : 'text-neutral-500'}`}>武器</button>
                  <button onClick={() => setTab('armor')} className={`flex-1 py-2 px-3 whitespace-nowrap rounded-lg text-sm font-bold ${tab === 'armor' ? 'bg-green-900/50 text-green-200 border border-green-800' : 'text-neutral-500'}`}>防具</button>
                  <button onClick={() => setTab('title')} className={`flex-1 py-2 px-3 whitespace-nowrap rounded-lg text-sm font-bold ${tab === 'title' ? 'bg-green-900/50 text-green-200 border border-green-800' : 'text-neutral-500'}`}>稱號</button>
                </div>
                <div className="flex-1 overflow-y-auto p-2 space-y-2">
                  {ownedItems.length === 0 && <div className="text-center text-neutral-600 mt-10">沒有可回收的物品</div>}
                  {ownedItems.map(item => {
                      const totalOwned = userInv[item.id];
                      const isEquipped = current === item.id;
                      const availableToRecycle = isEquipped ? totalOwned - 1 : totalOwned;
                      const recycleVal = getRecycleValue(item.prob);

                      if (availableToRecycle <= 0) return null;

                      return (
                        <div key={item.id} className="p-3 rounded-xl border border-neutral-700 bg-neutral-800/50 flex flex-col gap-3 transition">
                          <div className="flex items-center gap-4">
                            {item.icon && <div className={`${item.color} bg-black/40 p-2 rounded-lg`}><item.icon size={24}/></div>}
                            <div className="flex-1">
                              <div className={`font-bold ${item.color} truncate`}>{item.name}</div>
                              <div className="text-xs text-neutral-400 mt-1">
                                數量: <span className="text-white">{availableToRecycle}</span> | 回收價: <span className="text-purple-400">+{recycleVal} 知識點/件</span>
                              </div>
                            </div>
                          </div>
                          <div className="flex gap-2">
                              <button onClick={() => onRecycle(tab, item.id, 1, recycleVal)} className="flex-1 bg-green-700/80 hover:bg-green-600 text-white text-xs font-bold py-2 rounded-lg transition">
                                回收 1 件
                              </button>
                              {availableToRecycle > 1 && (
                                  <button onClick={() => onRecycle(tab, item.id, availableToRecycle, recycleVal * availableToRecycle)} className="flex-1 bg-green-900 hover:bg-green-800 border border-green-700 text-green-200 text-xs font-bold py-2 rounded-lg transition">
                                    全部回收
                                  </button>
                              )}
                          </div>
                        </div>
                      )
                  })}
                </div>
              </div>
            </div>
          );
        };

        // 洛津藏寶庫
        const VaultModal = ({ userData, onBuy, onClose }) => {
          const [tab, setTab] = useState('weapon'); 

          const getList = () => {
            if (tab === 'title') return TITLES_POOL;
            if (tab === 'weapon') return WEAPONS_POOL;
            if (tab === 'race') return RACES_POOL;
            return ARMORS_POOL;
          };

          const pool = getList();
          // 只顯示可兌換的物品 (prob <= 2)
          const vaultItems = pool.filter(item => getVaultCost(item.prob) !== null).sort((a,b) => a.prob - b.prob);

          return (
            <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-yellow-600/50 rounded-3xl w-full max-w-md h-[80vh] flex flex-col animate-slide-up">
                <div className="p-4 border-b border-neutral-800 flex justify-between items-center bg-yellow-950/30 rounded-t-3xl">
                  <div>
                      <h2 className="text-xl font-bold text-yellow-400 flex items-center gap-2"><Store /> 洛津藏寶庫</h2>
                      <div className="text-xs text-neutral-400 mt-1 flex items-center gap-1">您擁有: <BookMarked size={12} className="text-purple-400"/> {userData.knowledgePoints} 知識點</div>
                  </div>
                  <button onClick={onClose}><XCircle className="text-neutral-500 hover:text-white" /></button>
                </div>
                <div className="flex p-2 gap-2 bg-neutral-950 overflow-x-auto">
                  <button onClick={() => setTab('race')} className={`flex-1 py-2 px-3 whitespace-nowrap rounded-lg text-sm font-bold ${tab === 'race' ? 'bg-yellow-900/50 text-yellow-200 border border-yellow-800' : 'text-neutral-500'}`}>種族</button>
                  <button onClick={() => setTab('weapon')} className={`flex-1 py-2 px-3 whitespace-nowrap rounded-lg text-sm font-bold ${tab === 'weapon' ? 'bg-yellow-900/50 text-yellow-200 border border-yellow-800' : 'text-neutral-500'}`}>武器</button>
                  <button onClick={() => setTab('armor')} className={`flex-1 py-2 px-3 whitespace-nowrap rounded-lg text-sm font-bold ${tab === 'armor' ? 'bg-yellow-900/50 text-yellow-200 border border-yellow-800' : 'text-neutral-500'}`}>防具</button>
                  <button onClick={() => setTab('title')} className={`flex-1 py-2 px-3 whitespace-nowrap rounded-lg text-sm font-bold ${tab === 'title' ? 'bg-yellow-900/50 text-yellow-200 border border-yellow-800' : 'text-neutral-500'}`}>稱號</button>
                </div>
                <div className="flex-1 overflow-y-auto p-2 space-y-2">
                  {vaultItems.map(item => {
                      const cost = getVaultCost(item.prob);
                      const canAfford = (userData.knowledgePoints || 0) >= cost;

                      return (
                        <div key={item.id} className="p-3 rounded-xl border border-neutral-700 bg-neutral-800/50 flex justify-between items-center transition">
                          <div className="flex items-center gap-4 max-w-[65%]">
                            {item.icon && <div className={`${item.color} bg-black/40 p-2 rounded-lg`}><item.icon size={24}/></div>}
                            <div className="truncate">
                              <div className={`font-bold ${item.color} truncate`}>{item.name}</div>
                              <div className="text-[10px] text-neutral-400 mt-1">
                                {item.atk && `ATK +${item.atk} `}
                                {item.hp && `HP +${item.hp}`}
                              </div>
                            </div>
                          </div>
                          <button 
                              disabled={!canAfford}
                              onClick={() => onBuy(tab, item.id, cost)} 
                              className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition ${canAfford ? 'bg-yellow-600 hover:bg-yellow-500 text-black' : 'bg-neutral-800 text-neutral-600 cursor-not-allowed border border-neutral-700'}`}
                          >
                             {cost} 知識點
                          </button>
                        </div>
                      )
                  })}
                </div>
              </div>
            </div>
          );
        };

        const MenuView = ({ userData, onStart, onGacha, onInv, onTraining, onReset, onOpenRecycler, onOpenVault }) => {
          const myTitle = TITLES_POOL.find(t => t.id === userData.equipped.title);
          const myWeapon = WEAPONS_POOL.find(w => w.id === userData.equipped.weapon);
          const myArmor = ARMORS_POOL.find(a => a.id === userData.equipped.armor);
          const myRace = RACES_POOL.find(r => r.id === userData.equipped.race);

          const getRarityStyle = (item) => {
                if (!item) return "text-neutral-600";
                let base = item.color;
                if (item.color === 'text-rainbow') return `text-rainbow glow-legendary animate-pulse font-black`;
                if (item.prob <= 1) return `${base} glow-legendary animate-pulse font-black`;
                if (item.prob <= 2) return `${base} glow-epic font-bold`;
                if (item.prob <= 3) return `${base} glow-rare font-bold`;
                return base;
          };

          const AvatarIcon = myRace ? myRace.icon : Users;

          return (
            <div className="fixed inset-0 bg-neutral-950 text-white flex flex-col items-center p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-neutral-800 to-neutral-950 h-[100dvh] overflow-y-auto">
               
               {/* 兩側懸浮按鈕：神秘回收商 & 洛津藏寶庫 */}
               <button onClick={onOpenRecycler} className="fixed left-0 top-[20%] md:top-1/3 transform -translate-y-1/2 bg-neutral-900/90 backdrop-blur border-2 border-l-0 border-green-600 p-2 md:p-3 rounded-r-2xl shadow-[0_0_15px_rgba(22,163,74,0.3)] z-20 flex flex-col items-center gap-2 hover:bg-green-900/80 transition">
                    <RefreshCw className="text-green-500 w-5 h-5 md:w-6 md:h-6 animate-spin-slow" />
                    <span className="text-green-400 font-black text-xs md:text-sm tracking-widest" style={{ writingMode: 'vertical-rl' }}>神秘回收商</span>
               </button>

               <button onClick={onOpenVault} className="fixed right-0 top-[20%] md:top-1/3 transform -translate-y-1/2 bg-neutral-900/90 backdrop-blur border-2 border-r-0 border-yellow-600 p-2 md:p-3 rounded-l-2xl shadow-[0_0_15px_rgba(202,138,4,0.3)] z-20 flex flex-col items-center gap-2 hover:bg-yellow-900/80 transition">
                    <Store className="text-yellow-500 w-5 h-5 md:w-6 md:h-6 animate-pulse" />
                    <span className="text-yellow-400 font-black text-xs md:text-sm tracking-widest" style={{ writingMode: 'vertical-rl' }}>洛津藏寶庫</span>
               </button>

               <div className="w-full max-w-md space-y-6 animate-slide-up flex flex-col items-center justify-center min-h-full py-6">
                 <header className="text-center mt-8 md:mt-0">
                    <h1 className="text-4xl md:text-5xl font-black italic text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 flex justify-center items-center gap-3">
                      <Swords className="w-10 h-10 md:w-12 md:h-12 text-purple-500" /> 洛津大亂鬥
                    </h1>
                 </header>

                 <div className="glass-panel rounded-3xl p-6 shadow-2xl relative w-full">
                    <div className="flex flex-col items-center">
                       {/* 角色與稱號 */}
                       <div className="w-24 h-24 bg-neutral-800 rounded-full mb-3 flex items-center justify-center border-4 border-neutral-700 shadow-inner relative">
                          <AvatarIcon className={`w-12 h-12 ${myRace ? myRace.color : 'text-neutral-400'}`} />
                          {myTitle && <div className="absolute -top-2 -right-2 bg-neutral-900 rounded-full p-1.5 border border-yellow-500 shadow-lg"><myTitle.icon className={`w-5 h-5 ${myTitle.color}`} /></div>}
                       </div>
                       
                       <div className={`text-xl md:text-2xl font-bold mb-1 ${getRarityStyle(myTitle)} text-center px-4`}>
                          {myTitle ? myTitle.name : "無名小卒"}
                       </div>
                       <div className={`text-sm mb-4 font-bold ${myRace ? myRace.color : 'text-neutral-500'}`}>
                          {myRace ? myRace.name : "未知種族"}
                       </div>

                       {/* 裝備展示 (大圖示) */}
                       <div className="flex gap-4 mb-6 w-full justify-center">
                           <div className="flex-1 bg-neutral-900/60 p-3 rounded-2xl border border-white/5 flex flex-col items-center gap-2">
                               <span className="text-[10px] text-neutral-500 uppercase tracking-wider font-bold">WEAPON</span>
                               <div className={`h-12 flex items-center justify-center transition-all duration-300 ${myWeapon ? myWeapon.color : 'text-neutral-700'}`}>
                                   {myWeapon ? <myWeapon.icon size={40} className={getRarityStyle(myWeapon)} /> : <X size={32}/>}
                               </div>
                               <span className={`text-xs truncate max-w-full font-bold ${myWeapon ? myWeapon.color : 'text-neutral-600'}`}>{myWeapon ? myWeapon.name : "空手"}</span>
                           </div>
                           
                           <div className="flex-1 bg-neutral-900/60 p-3 rounded-2xl border border-white/5 flex flex-col items-center gap-2">
                               <span className="text-[10px] text-neutral-500 uppercase tracking-wider font-bold">ARMOR</span>
                               <div className={`h-12 flex items-center justify-center transition-all duration-300 ${myArmor ? myArmor.color : 'text-neutral-700'}`}>
                                   {myArmor ? <myArmor.icon size={40} className={getRarityStyle(myArmor)} /> : <Ghost size={32}/>}
                               </div>
                               <span className={`text-xs truncate max-w-full font-bold ${myArmor ? myArmor.color : 'text-neutral-600'}`}>{myArmor ? myArmor.name : "裸奔"}</span>
                           </div>
                       </div>

                       <div className="flex gap-2 mb-6 flex-wrap justify-center w-full">
                           <div className="flex items-center gap-2 text-yellow-500 bg-yellow-900/20 px-4 py-1.5 rounded-full border border-yellow-500/20">
                              <Zap className="w-4 h-4 fill-yellow-500" />
                              <span className="font-mono font-bold text-sm md:text-base">{userData.points} 積分</span>
                           </div>
                           <div className="flex items-center gap-2 text-purple-400 bg-purple-900/20 px-4 py-1.5 rounded-full border border-purple-500/20">
                              <BookMarked className="w-4 h-4 fill-purple-400" />
                              <span className="font-mono font-bold text-sm md:text-base">{userData.knowledgePoints || 0} 知識點</span>
                           </div>
                       </div>
                       
                       <div className="grid grid-cols-2 gap-3 w-full">
                          <button onClick={onInv} className="glass-btn py-3 rounded-xl flex items-center justify-center gap-2 font-bold"><Backpack className="w-4 h-4"/> 背包</button>
                          <button onClick={onGacha} className="glass-btn py-3 rounded-xl flex items-center justify-center gap-2 font-bold"><Dices className="w-4 h-4"/> 抽獎</button>
                       </div>
                    </div>
                 </div>

                 <button onClick={onTraining} className="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:opacity-90 text-white font-black py-4 rounded-2xl shadow-lg text-xl flex items-center justify-center gap-3 transition transform active:scale-95">
                     <BookOpen className="w-6 h-6" /> 進入精神時光屋 (刷分)
                 </button>

                 <div className="space-y-3 pt-4 border-t border-neutral-800 w-full">
                    {/* 分割戰場按鈕 */}
                    <div className="flex gap-2">
                       <button onClick={() => onStart('create_br')} className="flex-1 bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-white font-black py-4 rounded-2xl shadow-lg text-sm flex items-center justify-center gap-2 transition transform active:scale-95">
                          <Flame className="w-5 h-5 animate-pulse" /> 建大亂鬥
                       </button>
                       <button onClick={() => onStart('create_boss')} className="flex-1 bg-gradient-to-r from-red-700 to-red-900 hover:opacity-90 text-white font-black py-4 rounded-2xl shadow-lg text-sm flex items-center justify-center gap-2 transition transform active:scale-95">
                          <Skull className="w-5 h-5 animate-pulse" /> 建BOSS戰
                       </button>
                    </div>
                    <div className="flex gap-2">
                       <input type="number" id="code" placeholder="輸入戰場代碼" className="flex-1 bg-neutral-900 border border-neutral-700 rounded-xl px-4 text-center font-mono text-lg outline-none focus:border-purple-500 transition" />
                       <button onClick={() => onStart('join', document.getElementById('code').value)} className="bg-neutral-800 hover:bg-neutral-700 text-white font-bold px-8 rounded-xl border border-neutral-700">加入</button>
                    </div>
                 </div>

                 <button onClick={onReset} className="w-full mt-8 text-neutral-600 text-xs flex items-center justify-center gap-1 hover:text-red-500 pb-8"><Eraser className="w-3 h-3"/> 重置所有資料</button>
               </div>
            </div>
          );
        };

        const LobbyView = ({ roomCode, roomType, players, isHost, onStart, onAddAI, onLeave }) => {
           const pList = Object.values(players);
           const getItem = (pool, id) => pool.find(i => i.id === id);

           const getRarityStyle = (item) => {
                if (!item) return "text-neutral-600";
                let base = item.color;
                if (item.color === 'text-rainbow') return `text-rainbow glow-legendary animate-pulse font-black`;
                if (item.prob <= 1) return `glow-legendary animate-pulse font-black ${base}`;
                if (item.prob <= 2) return `glow-epic font-bold ${base}`;
                if (item.prob <= 3) return `glow-rare font-bold ${base}`;
                return base;
           };

           const isBossMode = roomType === 'boss';
           // BOSS戰最多5名玩家，大亂鬥最多4名玩家
           const capacityArr = isBossMode ? [0,1,2,3,4] : [0,1,2,3];
           const humanList = pList.filter(p => !p.isBoss);
           const bossInfo = pList.find(p => p.isBoss);
           
           const getBossData = (name) => BOSS_DATA.find(b => b.name === name) || { icon: IconVoid, color: "text-red-500" };
           const activeBossData = bossInfo ? getBossData(bossInfo.name) : null;

           return (
             <div className="fixed inset-0 bg-neutral-950 text-white flex flex-col items-center p-6 bg-[url('https://images.unsplash.com/photo-1614728263952-84ea256f9679?q=80&w=2808&auto=format&fit=crop')] bg-cover bg-center h-[100dvh] overflow-y-auto">
                <div className="absolute inset-0 bg-black/80 backdrop-blur-sm fixed"></div>
                <div className="glass-panel p-6 rounded-3xl w-full max-w-4xl relative animate-slide-up flex flex-col my-auto max-h-full overflow-y-auto">
                   <div className="flex justify-between items-center mb-4">
                        <h2 className={`text-2xl md:text-3xl font-black tracking-wider ${isBossMode ? 'text-red-500' : 'text-purple-400'}`}>
                           {isBossMode ? 'BOSS戰 等待大廳' : '等待大廳'}
                        </h2>
                        <button onClick={onLeave} className="text-neutral-500 hover:text-white bg-neutral-900/50 px-4 py-2 rounded-lg text-sm flex-shrink-0 ml-2">離開</button>
                   </div>
                   
                   <div className="text-center mb-6">
                        <span className="bg-neutral-900/50 border border-neutral-700 px-6 py-2 rounded-lg font-mono text-xl md:text-2xl tracking-[0.2em] shadow-inner">{roomCode}</span>
                   </div>
                   
                   {/* BOSS 專屬展示區塊 */}
                   {isBossMode && bossInfo && activeBossData && (
                       <div className="w-full mb-6 border-2 border-red-900 bg-red-950/50 rounded-2xl p-4 flex flex-col items-center shadow-[0_0_20px_rgba(220,38,38,0.3)]">
                           <activeBossData.icon size={48} className={`${activeBossData.color} animate-pulse mb-2`} style={{ filter: 'drop-shadow(0 0 10px currentColor)' }} />
                           <div className={`text-2xl font-black ${activeBossData.color} mb-1 tracking-widest text-center px-2`} style={{ filter: 'drop-shadow(0 0 5px currentColor)' }}>{bossInfo.name}</div>
                           <div className="text-sm text-red-300 font-mono bg-black/50 px-4 py-1 rounded-full">HP: {bossInfo.maxHp} / ATK: {bossInfo.atk}</div>
                       </div>
                   )}

                   <div className={`grid grid-cols-1 sm:grid-cols-2 gap-3 mb-8 ${isBossMode ? 'md:grid-cols-5' : 'md:grid-cols-4'}`}>
                      {capacityArr.map(i => {
                         const p = humanList[i]; // 只顯示非BOSS玩家
                         const title = p?.equipment?.title ? getItem(TITLES_POOL, p.equipment.title) : null;
                         const weapon = p?.equipment?.weapon ? getItem(WEAPONS_POOL, p.equipment.weapon) : null;
                         const armor = p?.equipment?.armor ? getItem(ARMORS_POOL, p.equipment.armor) : null;
                         const race = p?.equipment?.race ? getItem(RACES_POOL, p.equipment.race) : null;
                         
                         const RaceIcon = race ? race.icon : (p?.isAI ? Bot : Users);

                         return <div key={i} className="min-h-[180px] border-2 border-dashed border-neutral-700 rounded-xl flex flex-col items-center p-2 bg-neutral-800/50 relative overflow-hidden transition hover:border-neutral-500">
                            {p ? (
                               <>
                                 <div className={`w-12 h-12 rounded-full flex items-center justify-center mb-1 shadow-lg shrink-0 ${p.isAI ? 'bg-red-900 text-red-200' : 'bg-blue-900 text-blue-200'}`}>
                                     <RaceIcon size={24}/>
                                 </div>
                                 <div className="font-bold text-sm truncate w-full text-center mb-1">{p.name}</div>
                                 {race && <div className={`text-[10px] ${race.color} mb-1 flex items-center gap-1 justify-center bg-black/30 px-2 py-0.5 rounded-full w-11/12 truncate`}><race.icon size={10} className="flex-shrink-0" /> <span className="truncate">{race.name}</span></div>}
                                 {title && <div className={`text-[10px] ${title.color === 'text-rainbow' ? 'text-rainbow' : title.color} mb-2 flex items-center gap-1 justify-center bg-black/30 px-2 py-0.5 rounded-full w-11/12 truncate`}><title.icon size={10} className="flex-shrink-0" /> <span className="truncate">{title.name}</span></div>}
                                 
                                 <div className="flex gap-1 w-full justify-center mb-2">
                                     <div className={`flex-1 bg-black/40 rounded p-1 flex flex-col items-center justify-center border border-white/5 ${weapon ? weapon.color : 'text-neutral-700'} overflow-hidden`}>
                                         {weapon ? <weapon.icon size={20} className={getRarityStyle(weapon)} /> : <X size={16}/>}
                                     </div>
                                     <div className={`flex-1 bg-black/40 rounded p-1 flex flex-col items-center justify-center border border-white/5 ${armor ? armor.color : 'text-neutral-700'} overflow-hidden`}>
                                         {armor ? <armor.icon size={20} className={getRarityStyle(armor)} /> : <Ghost size={16}/>}
                                     </div>
                                 </div>

                                 <div className="text-[10px] text-neutral-400 font-mono bg-black/40 px-2 py-0.5 rounded-full mt-auto">HP {p.maxHp} / ATK {p.atk}</div>
                               </>
                            ) : <span className="text-neutral-700 text-xs mt-10">等待加入...</span>}
                         </div>
                      })}
                   </div>
                   {isHost ? (
                      <div className="space-y-3 mt-auto">
                         {/* BOSS戰不可加入AI */}
                         {!isBossMode && <button onClick={onAddAI} disabled={humanList.length>=4} className="w-full glass-btn py-3 rounded-xl font-bold hover:bg-white/10 disabled:opacity-50">加入 AI 機器人</button>}
                         <button onClick={onStart} disabled={humanList.length<(!isBossMode?2:1)} className="w-full bg-green-600 py-3 rounded-xl font-black hover:bg-green-500 disabled:grayscale text-lg shadow-lg shadow-green-900/50">開始戰鬥</button>
                      </div>
                   ) : <div className="text-center animate-pulse text-neutral-400 mt-auto pb-4">等待指揮官開始...</div>}
                </div>
             </div>
           );
        };

        const GameView = ({ roomType, myUid, players, question, onAnswer, targetMode, onAttack, onHeal, feedback }) => {
           const me = players[myUid];
           // BOSS戰模式：對手列表中只有BOSS；大亂鬥模式：對手列表中不包含自己
           const opponents = Object.values(players).filter(p => p.uid !== myUid && (roomType === 'boss' ? p.isBoss : true));
           const isBossMode = roomType === 'boss';

           const getItem = (pool, id) => pool.find(i => i.id === id);
           const getBossData = (name) => BOSS_DATA.find(b => b.name === name) || { icon: IconVoid, color: "text-red-500" };
           const MyRaceIcon = me?.equipment?.race ? getItem(RACES_POOL, me.equipment.race).icon : (me?.isAI ? Bot : Users);

           // 陣亡畫面，如果是BOSS戰則等待結果
           if (!me || me.status === 'dead') return (
              <div className="fixed inset-0 bg-neutral-950 flex flex-col items-center justify-center text-white z-50">
                 <Skull className="w-24 h-24 text-neutral-700 mb-4 animate-bounce" />
                 <h2 className="text-4xl font-black text-red-600 mb-2">已陣亡</h2>
                 <p className="text-neutral-500 mb-4 text-center px-4">{isBossMode ? '請為隊友祈禱，等待戰鬥結束...' : '勝敗乃兵家常事，大俠請重新來過'}</p>
                 {isBossMode && <div className="animate-pulse flex items-center gap-2 text-yellow-500"><Swords size={16}/> 隊友奮戰中...</div>}
              </div>
           );

           return (
              <div className="fixed inset-0 bg-neutral-950 text-white flex flex-col bg-[url('https://images.unsplash.com/photo-1599058945522-28d584b6f0ff?q=80&w=2069&auto=format&fit=crop')] bg-cover bg-center h-[100dvh]">
                 <div className="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>
                 
                 {/* 對手列表 - 橫向滾動 */}
                 <div className="relative z-10 flex-none p-2 bg-neutral-900/60 border-b border-white/10 flex justify-center gap-2 overflow-x-auto min-h-[120px]">
                    {opponents.map(op => {
                       const opRace = op?.equipment?.race ? getItem(RACES_POOL, op.equipment.race) : null;
                       const bossData = op.isBoss ? getBossData(op.name) : null;
                       const OpRaceIcon = op.isBoss ? bossData.icon : (opRace ? opRace.icon : (op?.isAI ? Bot : Users));
                       
                       return (
                           <button key={op.uid} disabled={!targetMode || op.status === 'dead' || (isBossMode && !op.isBoss)} onClick={() => targetMode && onAttack(op.uid)}
                              className={`relative p-2 rounded-xl border transition-all ${op.isBoss ? 'w-32 md:w-48 bg-red-950/60 border-red-800' : 'w-24 md:w-32 bg-black/40 border-neutral-700'} flex flex-col items-center flex-shrink-0 ${targetMode && op.status !== 'dead' && (!isBossMode || op.isBoss) ? 'border-red-500 scale-105 shadow-[0_0_20px_rgba(220,38,38,0.5)] animate-pulse cursor-crosshair' : ''} ${op.status === 'dead' ? 'opacity-30 grayscale' : ''}`}>
                              <div className={`text-xs font-bold truncate w-full text-center mb-1 px-1 ${op.isBoss ? `${bossData.color} text-sm` : 'text-neutral-300'}`} style={op.isBoss ? {filter: 'drop-shadow(0 0 5px currentColor)'} : {}}>{op.name}</div>
                              <div className="w-full h-1.5 bg-neutral-800 rounded-full overflow-hidden mb-1 ring-1 ring-white/10">
                                 <div className="h-full bg-gradient-to-r from-red-600 to-red-400 hp-transition" style={{width: `${(op.hp / op.maxHp) * 100}%`}}></div>
                              </div>
                              <div className="text-[10px] text-neutral-400 font-mono mb-1">{op.hp}/{op.maxHp}</div>
                              <div className={`flex gap-1 justify-center ${op.isBoss ? bossData.color : 'opacity-60 scale-75'}`} style={op.isBoss ? {filter: 'drop-shadow(0 0 8px currentColor)'} : {}}>
                                  <OpRaceIcon size={op.isBoss ? 32 : 24} className={!op.isBoss && opRace ? opRace.color : ''} />
                              </div>
                              {targetMode && op.status !== 'dead' && (!isBossMode || op.isBoss) && <div className="absolute -bottom-3 bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-lg animate-bounce z-20">點擊攻擊</div>}
                           </button>
                       )
                    })}
                 </div>
                 
                 {/* 中間問題區 - 可滾動 */}
                 <div className="relative z-10 flex-1 flex flex-col justify-center p-4 overflow-y-auto">
                    <div className="w-full max-w-4xl mx-auto my-auto">
                        {targetMode ? (
                            <div className="text-center animate-pop py-10">
                                <Swords className="w-24 h-24 text-red-500 mx-auto mb-4 animate-pulse" />
                                <h2 className="text-3xl font-black text-white mb-2">行動機會！</h2>
                                <p className="text-neutral-400 mb-6">請點擊上方目標進行攻擊{isBossMode ? '，或選擇治癒自己' : ''}</p>
                                
                                {/* BOSS 戰專屬：補血按鈕 */}
                                {isBossMode && (
                                    <button 
                                        onClick={onHeal}
                                        className="bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-8 rounded-full shadow-lg shadow-green-900/50 flex items-center justify-center gap-2 mx-auto transition transform active:scale-95"
                                    >
                                        <Heart size={20} className="animate-pulse" /> 治癒自己 (+{me.atk * 2} HP)
                                    </button>
                                )}
                            </div>
                        ) : (
                            <QuestionCard 
                                question={question} 
                                onAnswer={onAnswer} 
                                feedback={feedback} 
                                disabled={!!feedback}
                            />
                        )}
                    </div>
                 </div>

                 {/* 底部玩家狀態 */}
                 <div className="relative z-10 flex-none p-3 bg-neutral-900/90 border-t border-white/10">
                    <div className="max-w-4xl mx-auto flex items-center gap-3 md:gap-4">
                       <div className="w-12 h-12 md:w-14 md:h-14 bg-gradient-to-br from-blue-600 to-blue-900 rounded-2xl flex items-center justify-center border border-blue-400/50 font-bold shadow-lg text-lg flex-shrink-0">
                           <MyRaceIcon size={28} className="text-white" />
                       </div>
                       <div className="flex-1 overflow-hidden">
                          <div className="flex justify-between items-end mb-1">
                             <span className="font-bold text-base md:text-lg text-white truncate mr-2">{me.name}</span>
                             <span className="text-xs font-bold text-yellow-500 bg-yellow-900/30 px-2 py-0.5 rounded border border-yellow-500/30 whitespace-nowrap">ATK: {me.atk}</span>
                          </div>
                          <div className="w-full h-4 md:h-5 bg-neutral-800 rounded-full overflow-hidden border border-neutral-600 relative shadow-inner">
                             <div className="h-full bg-gradient-to-r from-blue-500 to-cyan-400 hp-transition" style={{width: `${(me.hp / me.maxHp) * 100}%`}}></div>
                             <div className="absolute inset-0 flex items-center justify-center text-[10px] md:text-xs font-bold text-white shadow-black drop-shadow-md tracking-wider">{me.hp} / {me.maxHp}</div>
                          </div>
                       </div>
                    </div>
                 </div>
              </div>
           );
        };

        const App = () => {
           const [user, setUser] = useState(null);
           const [userData, setUserData] = useState(DEFAULT_USER_DATA);
           const [view, setView] = useState('loading'); 
           
           const [roomCode, setRoomCode] = useState('');
           const [roomData, setRoomData] = useState(null);
           const [myQuestion, setMyQuestion] = useState(null);
           const [targetMode, setTargetMode] = useState(false);
           const [feedback, setFeedback] = useState(null);

           const [showGacha, setShowGacha] = useState(false);
           const [showInv, setShowInv] = useState(false);
           const [showTraining, setShowTraining] = useState(false);
           const [showResetConfirm, setShowResetConfirm] = useState(false);
           
           // 新增的 Modal 狀態
           const [showRecycler, setShowRecycler] = useState(false);
           const [showVault, setShowVault] = useState(false);

           const aiInterval = useRef(null);
           const aiState = useRef({});

           useEffect(() => {
              const init = async () => {
                 if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                 else await signInAnonymously(auth);
              };
              init();
              return onAuthStateChanged(auth, u => {
                 if (u) {
                    setUser(u);
                    setUserData(loadUserData());
                    setView('menu');
                 }
              });
           }, []);

           useEffect(() => {
              if (!roomCode || !user) return;
              const unsub = onSnapshot(getDocRef(ROOM_COLLECTION, roomCode), (snap) => {
                 if (snap.exists()) {
                    const d = snap.data();
                    setRoomData(d);
                    if (view === 'lobby' && d.status === 'playing') {
                       setView('game');
                       setMyQuestion(getRandomQuestion());
                    }
                 }
              });
              return () => unsub();
           }, [roomCode, user, view]);

           // 遊戲主迴圈 (AI 與 BOSS 行為)
           useEffect(() => {
              if (view !== 'game' || !roomData || roomData.host !== user?.uid || roomData.status !== 'playing') {
                 if (aiInterval.current) { clearInterval(aiInterval.current); aiInterval.current = null; }
                 return;
              }
              if (!aiInterval.current) {
                 aiInterval.current = setInterval(async () => {
                    const snap = await getDoc(getDocRef(ROOM_COLLECTION, roomCode));
                    if (!snap.exists()) return;
                    const rd = snap.data();
                    if (rd.status !== 'playing') return;

                    const players = rd.players;
                    const now = Date.now();
                    let updates = {};
                    let hasUpdate = false;

                    if (rd.type === 'boss') {
                        // BOSS 攻擊邏輯
                        const boss = players['BOSS_01'];
                        if (boss && boss.status === 'alive') {
                            if (!aiState.current.bossNextAttack) {
                                aiState.current.bossNextAttack = now + 1000 + Math.random() * 2000;
                            }
                            if (now >= aiState.current.bossNextAttack) {
                                const aliveHumans = Object.values(players).filter(p => !p.isBoss && p.status === 'alive');
                                if (aliveHumans.length > 0) {
                                    const target = aliveHumans[Math.floor(Math.random() * aliveHumans.length)];
                                    
                                    // 根據存活玩家人數動態調整命中率
                                    let hitProb = 0.7;
                                    if (aliveHumans.length === 2) hitProb = 0.8;
                                    else if (aliveHumans.length === 3) hitProb = 0.85;
                                    else if (aliveHumans.length === 4) hitProb = 0.9;
                                    else if (aliveHumans.length >= 5) hitProb = 1.0;

                                    if (Math.random() < hitProb) {
                                        const curHp = updates[`players.${target.uid}.hp`] ?? target.hp;
                                        const newHp = Math.max(0, curHp - boss.atk);
                                        updates[`players.${target.uid}.hp`] = newHp;
                                        if (newHp <= 0) {
                                            updates[`players.${target.uid}.status`] = 'dead';
                                            updates[`players.${target.uid}.deathTime`] = now;
                                        }
                                        hasUpdate = true;
                                    }
                                }
                                aiState.current.bossNextAttack = now + 1000 + Math.random() * 2000;
                            }
                        }
                    } else {
                        // 一般大亂鬥 AI 攻擊邏輯
                        const ais = Object.values(players).filter(p => p.isAI && p.status === 'alive');
                        ais.forEach(ai => {
                           if (!aiState.current[ai.uid]) aiState.current[ai.uid] = now + 2000 + Math.random() * 3000;
                           
                           if (now >= aiState.current[ai.uid]) {
                              const willAttack = Math.random() < 0.5; 
                              if (willAttack) {
                                 const targets = Object.values(players).filter(p => p.uid !== ai.uid && p.status === 'alive');
                                 if (targets.length > 0) {
                                    const humans = targets.filter(p => !p.isAI);
                                    const bots = targets.filter(p => p.isAI);
                                    let target = null;
                                    const preferHuman = Math.random() < 0.7;
                                    if (preferHuman) {
                                       if(humans.length > 0) target = humans[Math.floor(Math.random()*humans.length)];
                                       else if(bots.length > 0) target = bots[Math.floor(Math.random()*bots.length)];
                                    } else {
                                       if(bots.length > 0) target = bots[Math.floor(Math.random()*bots.length)];
                                       else if(humans.length > 0) target = humans[Math.floor(Math.random()*humans.length)];
                                    }

                                    if (target) {
                                       const curHp = updates[`players.${target.uid}.hp`] ?? target.hp;
                                       const dmg = ai.atk;
                                       const newHp = Math.max(0, curHp - dmg);
                                       updates[`players.${target.uid}.hp`] = newHp;
                                       if (newHp <= 0) {
                                          updates[`players.${target.uid}.status`] = 'dead';
                                          updates[`players.${target.uid}.deathTime`] = now;
                                       }
                                       hasUpdate = true;
                                    }
                                 }
                              }
                              aiState.current[ai.uid] = now + 10000 + Math.random() * 10000; 
                           }
                        });
                    }

                    if (hasUpdate) await updateDoc(getDocRef(ROOM_COLLECTION, roomCode), updates);
                 }, 1000);
              }
           }, [view, roomCode, user]);

           // 勝負判定邏輯
           useEffect(() => {
              if (view === 'game' && roomData) {
                  const me = roomData.players[user.uid];
                  const aliveHumans = Object.values(roomData.players).filter(p => !p.isBoss && p.status === 'alive');
                  const boss = roomData.players['BOSS_01'];
                  const totalHumans = Object.values(roomData.players).filter(p => !p.isBoss).length;

                  if (roomData.type === 'boss') {
                      // BOSS戰 結束條件判斷 (限房主執行)
                      if (roomData.status === 'playing' && roomData.host === user.uid) {
                          if (boss && boss.status === 'dead') {
                              updateDoc(getDocRef(ROOM_COLLECTION, roomCode), { status: 'boss_win' });
                          } else if (aliveHumans.length === 0) {
                              updateDoc(getDocRef(ROOM_COLLECTION, roomCode), { status: 'boss_lose' });
                          }
                      }

                      // 玩家陣亡提示 (不退出房間，當觀眾)
                      if (roomData.status === 'playing' && me && me.status === 'dead' && !aiState.current.notifiedDeath) {
                          aiState.current.notifiedDeath = true;
                          alert("您已陣亡！請等待隊友擊敗 BOSS...");
                      }

                      // BOSS戰 結算
                      if (roomData.status === 'boss_win' && me && !aiState.current.handledEnd) {
                          aiState.current.handledEnd = true;
                          
                          // 取得 BOSS 專屬掉落 (機率 <= 2 的稀有物品)
                          const getBossReward = () => {
                              const allRareItems = [
                                  ...TITLES_POOL.filter(i => i.prob <= 2).map(i => ({...i, category: 'titles'})),
                                  ...WEAPONS_POOL.filter(i => i.prob <= 2).map(i => ({...i, category: 'weapons'})),
                                  ...ARMORS_POOL.filter(i => i.prob <= 2).map(i => ({...i, category: 'armors'})),
                                  ...RACES_POOL.filter(i => i.prob <= 2).map(i => ({...i, category: 'races'}))
                              ];
                              let sum = 0;
                              // 計算符合條件的總機率
                              const totalProb = allRareItems.reduce((acc, curr) => acc + curr.prob, 0);
                              const rand = Math.random() * totalProb;
                              
                              let selected = allRareItems[allRareItems.length - 1];
                              for (let item of allRareItems) {
                                  sum += item.prob;
                                  if (rand <= sum) {
                                      selected = item;
                                      break;
                                  }
                              }
                              return selected;
                          };

                          const reward = Math.floor(200 / totalHumans);
                          const rewardItem = getBossReward();
                          
                          const newData = { ...userData, points: userData.points + reward };
                          // 將戰利品放入背包
                          newData.inventory[rewardItem.category][rewardItem.id] = (newData.inventory[rewardItem.category][rewardItem.id] || 0) + 1;
                          
                          setUserData(saveUserData(newData));
                          alert(`🎉 擊敗了深淵魔神！\n所有參與者平分獎勵，您獲得了 ${reward} 積分！\n\n🎁 額外獲得戰利品：${rewardItem.name}`);
                          resetGame();
                      } else if (roomData.status === 'boss_lose' && me && !aiState.current.handledEnd) {
                          aiState.current.handledEnd = true;
                          alert(`💀 挑戰失敗！全軍覆沒...`);
                          resetGame();
                      }

                  } else {
                      // 原本的 大亂鬥 結束與陣亡邏輯
                      if (roomData.status === 'playing') {
                         if (me && me.status === 'dead') {
                            const rank = aliveHumans.length + 1; // 包含AI的存活數
                            const pts = [0, 10, 5, 3, 1][rank] || 1;
                            const newData = { ...userData, points: userData.points + pts };
                            setUserData(saveUserData(newData));
                            alert(`您已陣亡！獲得第 ${rank} 名，積分 +${pts}`);
                            resetGame();
                         }

                         if (roomData.host === user.uid) {
                             const totalAlive = Object.values(roomData.players).filter(p => p.status === 'alive').length;
                             if (totalAlive <= 1) {
                                 updateDoc(getDocRef(ROOM_COLLECTION, roomCode), { status: 'finished' });
                             }
                         }
                      }
                      if (roomData.status === 'finished') {
                         if (me && me.status === 'alive') {
                            const newData = { ...userData, points: userData.points + 10 };
                            setUserData(saveUserData(newData));
                            alert("恭喜獲得冠軍！積分 +10");
                            resetGame();
                         }
                      }
                  }
              }
           }, [roomData, view]);

           const resetGame = () => {
              setRoomCode('');
              setRoomData(null);
              setMyQuestion(null);
              setTargetMode(false);
              setFeedback(null);
              setView('menu');
              aiState.current = {};
           };

           const handleStart = async (mode, inputCode) => {
              try {
                  const myW = WEAPONS_POOL.find(w => w.id === userData.equipped.weapon);
                  const myA = ARMORS_POOL.find(a => a.id === userData.equipped.armor);
                  const myT = TITLES_POOL.find(t => t.id === userData.equipped.title);
                  const myR = RACES_POOL.find(r => r.id === userData.equipped.race);
                  
                  const isHighGrade = (item) => item && Number(item.prob) <= 3;
                  const isBetterThanHighGrade = (item) => item && Number(item.prob) < 3; // 機率小於3(即<=2)

                  // 確認門檻用的輔助函式
                  const checkRequirements = (roomType) => {
                      if (roomType === 'boss') {
                          const wPass = isBetterThanHighGrade(myW);
                          const aPass = isBetterThanHighGrade(myA);
                          const rPass = isBetterThanHighGrade(myR);
                          if (!wPass || !aPass || !rPass) {
                              const wMsg = myW ? `${myW.name} (機率${myW.prob}%) - ${wPass ? '✅' : '❌'}` : "未裝備 - ❌";
                              const aMsg = myA ? `${myA.name} (機率${myA.prob}%) - ${aPass ? '✅' : '❌'}` : "未裝備 - ❌";
                              const rMsg = myR ? `${myR.name} (機率${myR.prob}%) - ${rPass ? '✅' : '❌'}` : "未裝備 - ❌";
                              alert(`⚠️ BOSS戰資格不足！\n必須【同時】裝備比「高級」更好(機率小於3%) 的「武器」、「防具」與「種族」。\n\n裝備狀態：\n⚔️ 武器: ${wMsg}\n🛡️ 防具: ${aMsg}\n🧬 種族: ${rMsg}`);
                              return false;
                          }
                      } else {
                          const wPass = isHighGrade(myW);
                          const aPass = isHighGrade(myA);
                          if (!wPass || !aPass) {
                              const wMsg = myW ? `${myW.name} (機率${myW.prob}%) - ${wPass ? '✅' : '❌'}` : "未裝備 - ❌";
                              const aMsg = myA ? `${myA.name} (機率${myA.prob}%) - ${aPass ? '✅' : '❌'}` : "未裝備 - ❌";
                              alert(`⚠️ 戰場資格不足！\n必須【同時】裝備紫色「高級」(機率3%以下) 等級以上的「武器」與「防具」。\n\n裝備狀態：\n⚔️ 武器: ${wMsg}\n🛡️ 防具: ${aMsg}`);
                              return false;
                          }
                      }
                      return true;
                  };

                  // 數值計算：基礎值 + 武器 + 稱號 + 種族
                  const atk = 10 + (myW?.atk || 0) + (myT?.atk || 0) + (myR?.atk || 0);
                  const maxHp = 100 + (myA?.hp || 0) + (myT?.hp || 0) + (myR?.hp || 0);
                  const name = myT ? `[${myT.name}] 玩家` : `玩家`;

                  const equipment = {
                      title: userData.equipped.title || null,
                      weapon: userData.equipped.weapon || null,
                      armor: userData.equipped.armor || null,
                      race: userData.equipped.race || null
                  };

                  if (mode.startsWith('create')) {
                     const isBossMode = mode === 'create_boss';
                     if (!checkRequirements(isBossMode ? 'boss' : 'br')) return;

                     const code = Math.floor(100000 + Math.random()*900000).toString();
                     
                     let initialPlayers = {
                         [user.uid]: {
                             uid: user.uid,
                             name: name,
                             hp: maxHp,
                             maxHp: maxHp,
                             atk: atk,
                             status: 'alive',
                             isHost: true,
                             isAI: false,
                             isBoss: false,
                             equipment: equipment
                         }
                     };

                     // 若為 BOSS 戰，直接初始化 BOSS 實體
                     if (isBossMode) {
                         const randomBoss = BOSS_DATA[Math.floor(Math.random() * BOSS_DATA.length)];
                         const randomBossHp = Math.floor(Math.random() * 101) + 950; // 950 ~ 1050
                         const randomBossAtk = Math.floor(Math.random() * 11) + 95;  // 95 ~ 105

                         initialPlayers['BOSS_01'] = {
                             uid: 'BOSS_01',
                             name: randomBoss.name,
                             hp: randomBossHp,
                             maxHp: randomBossHp,
                             atk: randomBossAtk,
                             status: 'alive',
                             isHost: false,
                             isAI: false, 
                             isBoss: true,
                             equipment: { title: 't00', weapon: 'w00', armor: 'a00', race: 'r00' }
                         };
                     }

                     await setDoc(getDocRef(ROOM_COLLECTION, code), {
                        createdAt: Date.now(),
                        host: user.uid,
                        status: 'waiting',
                        type: isBossMode ? 'boss' : 'br',
                        players: initialPlayers
                     });
                     setRoomCode(code);
                     setView('lobby');

                  } else if (mode === 'join') {
                     if(!inputCode) return alert("請輸入代碼");
                     const ref = getDocRef(ROOM_COLLECTION, inputCode);
                     const snap = await getDoc(ref);
                     if (!snap.exists()) return alert("找不到房間");
                     const d = snap.data();
                     if (d.status !== 'waiting') return alert("遊戲已開始");
                     
                     const roomType = d.type || 'br';
                     if (!checkRequirements(roomType)) return;

                     const humansCount = Object.values(d.players).filter(p => !p.isBoss).length;
                     if (roomType === 'boss' && humansCount >= 5) return alert("BOSS戰已客滿(最多5人)");
                     if (roomType === 'br' && Object.keys(d.players).length >= 4) return alert("大亂鬥已客滿(最多4人)");
                     
                     await updateDoc(ref, { [`players.${user.uid}`]: {
                        uid: user.uid,
                        name: name + (humansCount + 1),
                        hp: maxHp,
                        maxHp: maxHp,
                        atk: atk,
                        status: 'alive',
                        isHost: false,
                        isAI: false,
                        isBoss: false,
                        equipment: equipment
                     }});
                     setRoomCode(inputCode);
                     setView('lobby');
                  }
              } catch (e) {
                  alert("操作失敗: " + e.message);
              }
           };

           const handleAddAI = async () => {
              if (!roomCode) return;
              const humansCount = Object.values(roomData.players).filter(p => !p.isBoss).length;
              if (humansCount >= 4) return;
              
              const aiId = "AI_" + Date.now();
              const getRandomItem = (pool) => {
                  const r = Math.random() * 100;
                  let s = 0;
                  for(let i of pool) {
                      s += i.prob;
                      if(r <= s) return i.id;
                  }
                  return pool[pool.length-1].id;
              };

              const aiRaceId = getRandomItem(RACES_POOL);
              const aiRace = RACES_POOL.find(r => r.id === aiRaceId);
              
              const baseHp = 100 + Math.floor(Math.random() * 50);
              const baseAtk = 10 + Math.floor(Math.random() * 15);
              
              const aiHp = baseHp + (aiRace?.hp || 0);
              const aiAtk = baseAtk + (aiRace?.atk || 0);
              
              await updateDoc(getDocRef(ROOM_COLLECTION, roomCode), {
                 [`players.${aiId}`]: {
                    uid: aiId,
                    name: `AI戰士 ${humansCount+1}`,
                    hp: aiHp,
                    maxHp: aiHp,
                    atk: aiAtk,
                    status: 'alive',
                    isAI: true,
                    isBoss: false,
                    equipment: { 
                        title: getRandomItem(TITLES_POOL), 
                        weapon: getRandomItem(WEAPONS_POOL), 
                        armor: getRandomItem(ARMORS_POOL),
                        race: aiRaceId
                    }
                 }
              });
           };

           const handleAttack = async (targetUid) => {
              setTargetMode(false);
              setMyQuestion(getRandomQuestion());
              const target = roomData.players[targetUid];
              const me = roomData.players[user.uid];
              const newHp = Math.max(0, target.hp - me.atk);
              let updates = { [`players.${targetUid}.hp`]: newHp };
              if (newHp <= 0) {
                 updates[`players.${targetUid}.status`] = 'dead';
                 updates[`players.${targetUid}.deathTime`] = Date.now();
              }
              await updateDoc(getDocRef(ROOM_COLLECTION, roomCode), updates);
           };

           const handleHeal = async () => {
              setTargetMode(false);
              setMyQuestion(getRandomQuestion());
              const me = roomData.players[user.uid];
              const healAmount = me.atk * 2;
              const newHp = Math.min(me.maxHp, me.hp + healAmount);
              let updates = { [`players.${user.uid}.hp`]: newHp };
              await updateDoc(getDocRef(ROOM_COLLECTION, roomCode), updates);
           };

           const handleAnswer = (idx) => {
              const isCorrect = idx === myQuestion.ans;
              if (isCorrect) {
                 setTargetMode(true);
              } else {
                 setFeedback({ correct: myQuestion.ans, wrong: idx });
                 setTimeout(() => {
                    setFeedback(null);
                    setMyQuestion(getRandomQuestion());
                 }, 2000);
              }
           };

           const handleGachaComplete = (mode, items) => {
              const itemsArray = Array.isArray(items) ? items : [items];
              const cost = itemsArray.length * 10;
              const newData = { ...userData, points: userData.points - cost };
              
              let category = 'titles';
              if (mode === 'weapon') category = 'weapons';
              else if (mode === 'armor') category = 'armors';
              else if (mode === 'race') category = 'races';

              itemsArray.forEach(item => {
                  const currentCount = newData.inventory[category][item.id] || 0;
                  newData.inventory[category][item.id] = currentCount + 1;
              });
              setUserData(saveUserData(newData));
           };

           const handleEquip = (category, itemId) => {
              const newData = { ...userData };
              newData.equipped[category] = itemId;
              setUserData(saveUserData(newData));
           };

           const handleTrainingPoints = (pts) => {
               const newData = { ...userData, points: userData.points + pts };
               setUserData(saveUserData(newData));
           };

           // 處理回收裝備
           const handleRecycle = (category, itemId, amount, pointsGained) => {
               const newData = { ...userData };
               let invKey = category === 'title' ? 'titles' : category + 's';
               if (category === 'race') invKey = 'races';

               newData.inventory[invKey][itemId] -= amount;
               if (newData.inventory[invKey][itemId] <= 0) {
                   delete newData.inventory[invKey][itemId];
               }
               newData.knowledgePoints = (newData.knowledgePoints || 0) + pointsGained;
               setUserData(saveUserData(newData));
           };

           // 處理藏寶庫購買
           const handleBuyVault = (category, itemId, cost) => {
               const newData = { ...userData };
               let invKey = category === 'title' ? 'titles' : category + 's';
               if (category === 'race') invKey = 'races';
               
               if ((newData.knowledgePoints || 0) >= cost) {
                   newData.knowledgePoints -= cost;
                   newData.inventory[invKey][itemId] = (newData.inventory[invKey][itemId] || 0) + 1;
                   setUserData(saveUserData(newData));
               }
           };

           if (view === 'loading') return <LoadingView />;

           return (
              <>
                 {view === 'menu' && (
                    <MenuView 
                        userData={userData} 
                        onStart={handleStart} 
                        onGacha={() => setShowGacha(true)} 
                        onInv={() => setShowInv(true)} 
                        onTraining={() => setShowTraining(true)} 
                        onReset={() => setShowResetConfirm(true)} 
                        onOpenRecycler={() => setShowRecycler(true)}
                        onOpenVault={() => setShowVault(true)}
                    />
                 )}
                 {view === 'lobby' && roomData && <LobbyView roomCode={roomCode} roomType={roomData.type || 'br'} players={roomData.players} isHost={roomData.host === user.uid} onStart={() => updateDoc(getDocRef(ROOM_COLLECTION, roomCode), {status:'playing'})} onAddAI={handleAddAI} onLeave={resetGame} />}
                 {view === 'game' && roomData && <GameView roomType={roomData.type || 'br'} myUid={user.uid} players={roomData.players} question={myQuestion} onAnswer={handleAnswer} targetMode={targetMode} onAttack={handleAttack} onHeal={handleHeal} feedback={feedback} />}
                 
                 {showGacha && <GachaModal userPoints={userData.points} onClose={() => setShowGacha(false)} onComplete={handleGachaComplete} />}
                 {showInv && <InventoryModal userData={userData} onEquip={handleEquip} onClose={() => setShowInv(false)} />}
                 {showTraining && <TrainingView onClose={() => setShowTraining(false)} onAddPoints={handleTrainingPoints} />}
                 {showResetConfirm && <ResetConfirmModal onConfirm={() => { localStorage.removeItem(STORAGE_KEY); window.location.reload(); }} onCancel={() => setShowResetConfirm(false)} />}
                 
                 {showRecycler && <RecyclerModal userData={userData} onRecycle={handleRecycle} onClose={() => setShowRecycler(false)} />}
                 {showVault && <VaultModal userData={userData} onBuy={handleBuyVault} onClose={() => setShowVault(false)} />}
              </>
           );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
